<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13834A">
<title>빵을그리다 영상통화</title>
<link rel="manifest" href="call.webmanifest">
<link rel="icon" href="call_192.png">
<link rel="apple-touch-icon" href="call_apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영상통화">
<style>
body{margin:0;background:#eef1f3;font-family:Pretendard,"Pretendard Variable","Malgun Gothic",sans-serif;color:#15202b;font-size:18px;word-break:keep-all}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid #d5dbe0;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:44px;width:auto}
.top h1{margin:0;font-size:24px;flex:1;white-space:nowrap}
.top .ver{font-size:16px;font-weight:800;color:#1b5e20;background:#e3f4e8;border-radius:10px;padding:6px 12px;white-space:nowrap}
.top button{min-height:54px;padding:6px 16px;border:0;border-radius:14px;background:#13834A;color:#fff;font:800 18px Pretendard,"Malgun Gothic",sans-serif;cursor:pointer}
.wrap{padding:16px}
.howto{max-width:860px;margin:14px auto 0;background:#fff;border-radius:18px;padding:16px 20px;font-size:17px;line-height:1.6;color:#263238;font-weight:600}
.howto ol{margin:6px 0 0;padding-left:24px}
</style>
</head>
<body>
<div class="top"><img src="brand_logo.png" alt="빵을그리다"><h1>📹 영상통화</h1><span class="ver" id="ver">v002 · 업데이트 확인 중</span><button id="inst" hidden>작업표시줄용으로 설치</button></div>
<div class="wrap"><div id="dbcHome"></div>
<div class="howto"><b>작업표시줄에 두는 법 (PC 한 번만)</b><ol>
<li>위 「작업표시줄용으로 설치」를 누릅니다. (버튼이 없으면 크롬 오른쪽 위 ⋮ → 「전송, 공유」 또는 「앱」 → 「설치」)</li>
<li>작업표시줄에 생긴 영상통화 아이콘을 오른쪽 클릭 → 「작업 표시줄에 고정」.</li>
<li>평소에는 창을 <b>최소화</b>만 해 두세요. 창을 닫으면 전화를 받을 수 없어요.</li>
<li>생산실 앱(생산일지)이 켜진 기기는 위쪽 빵을그리다 로고 옆 📹 버튼으로도 바로 걸고 받을 수 있어요.</li></ol></div></div>
<script>window.DBCALL_STANDALONE = true;</script>
<script>document.write('<script src="call.js?t=' + Date.now() + '"><\/script>');</script>
<script>
(function () {
  var v = document.getElementById('ver'); if (window.DBCALL) v.textContent = window.DBCALL.ver + ' · ' + window.DBCALL.built + ' 업데이트';
  var dp = null, b = document.getElementById('inst');
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); dp = e; b.hidden = false; });
  b.onclick = function () { if (dp) { dp.prompt(); dp.userChoice.then(function () { dp = null; b.hidden = true; }); } };
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
