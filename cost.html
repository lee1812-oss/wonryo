<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원가 계산기 · 빵을그리다</title>
<link rel="manifest" href="cost.webmanifest">
<link rel="icon" href="cost_192.png">
<link rel="apple-touch-icon" href="cost_apple.png">
<meta name="theme-color" content="#7A4A23">
<style>
:root{--br:#7A4A23;--br2:#A0693A;--brl:#F6EEE6;--bg:#F3F1EE;--ink:#1E1A17;--sub:#55504A;--line:#DED8D1;--red:#C62828;--redl:#FDECEC;--org:#D46A00;--orgl:#FFF3E0;--grn:#2E7D32;--grnl:#E8F5E9;--blu:#1E5AA8;--blul:#E8F0FB}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
header{background:var(--br);color:#fff;padding:12px 14px 0;position:sticky;top:0;z-index:20}
.hd{max-width:900px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header .s{font-size:14px;opacity:.85}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;min-height:52px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
nav button.on{background:var(--bg);color:var(--br)}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.card h2 .no{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--br);color:#fff;font-size:15px;align-items:center;justify-content:center;flex:none}
.help{color:var(--sub);font-size:15px;margin:2px 0 12px}
label.f{display:block;margin:10px 0 4px;font-weight:700;font-size:16px}
label.f small{font-weight:400;color:var(--sub)}
input,select{font:inherit;font-size:18px;color:var(--ink);border:1.5px solid #C9C1B8;border-radius:10px;padding:10px 12px;min-height:50px;width:100%;background:#fff}
input:focus,select:focus{outline:3px solid #E7C9A8;border-color:var(--br)}
input.miss{border-color:var(--org);background:var(--orgl)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{min-height:54px;border:0;border-radius:12px;padding:0 18px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--br);color:#fff}
.btn.g{background:#fff;color:var(--br);border:1.5px solid var(--br)}
.btn.gr{background:#EEEAE5;color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px}
.btn.del{background:#fff;color:var(--red);border:1.5px solid #E8B4B4}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar>select{flex:1;min-width:200px}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;vertical-align:middle}
.chip.o{background:var(--orgl);color:var(--org)}
.chip.g{background:var(--grnl);color:var(--grn)}
.chip.b{background:var(--blul);color:var(--blu)}
.chip.r{background:var(--redl);color:var(--red)}
/* 결과 */
.res{background:#fff;border:2px solid var(--br);border-radius:18px;padding:16px;margin-bottom:14px}
.res .lbl{font-size:16px;color:var(--sub);font-weight:700}
.res .big{font-size:44px;font-weight:800;color:var(--br);line-height:1.15;letter-spacing:-1px}
.res .big small{font-size:22px}
.res .cmp{font-size:16px;margin-top:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kp div{background:var(--brl);border-radius:12px;padding:10px}
.kp b{display:block;font-size:21px;white-space:nowrap}
.kp span{font-size:14px;color:var(--sub)}
.warn{background:var(--redl);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:10px}
.note{background:var(--orgl);color:#8A4500;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.info{background:var(--blul);color:#173F75;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
/* 폭포 */
.wf{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.wf .t{font-size:16px}
.wf .t small{display:block;color:var(--sub);font-size:13.5px;line-height:1.35}
.wf .v{font-weight:800;white-space:nowrap;text-align:right;font-size:17px}
.wf .bk{grid-column:1/3;height:10px;background:#EFEAE4;border-radius:6px;overflow:hidden;margin-bottom:8px;position:relative}
.wf .bk i{position:absolute;top:0;bottom:0;border-radius:6px}
.wf .tot{border-top:2px solid var(--ink);padding-top:8px;font-weight:800;font-size:18px}
/* 배합 표 */
.ing{width:100%;border-collapse:collapse}
.ing th{font-size:14px;color:var(--sub);text-align:left;font-weight:700;padding:4px 4px}
.ing td{padding:4px;vertical-align:top}
.ing td.n{width:38%}
.ing td.g{width:17%}
.ing td.p{width:21%}
.ing td.a{width:16%;text-align:right;font-weight:700;padding-top:16px;white-space:nowrap}
.ing td.x{width:44px}
.ing .bp{font-size:13px;color:var(--sub);display:block;text-align:right;margin-top:2px}
.ing .ps{font-size:12.5px;color:var(--sub);display:block;margin-top:2px;line-height:1.3}
.xb{width:40px;height:50px;border:0;background:none;color:#B33;font-size:24px;cursor:pointer}
.sum{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:800;font-size:18px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.presets button{min-height:40px;border:1.5px solid #C9C1B8;background:#fff;border-radius:999px;padding:0 14px;font:inherit;font-size:15px;cursor:pointer}
.presets button.on{background:var(--br);color:#fff;border-color:var(--br)}
.loss{border-top:1px dashed var(--line);padding-top:6px;margin-top:10px}
.loss:first-of-type{border-top:0}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:54px;border:1.5px solid #C9C1B8;background:#fff;border-radius:12px;font:inherit;font-size:16px;cursor:pointer;line-height:1.3}
.seg button.on{background:var(--br);color:#fff;border-color:var(--br);font-weight:700}
/* 목록 */
.it{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:18px}
.it .m span{font-size:14px;color:var(--sub)}
.it .r{text-align:right;white-space:nowrap;font-weight:800;font-size:19px;color:var(--br)}
.pi{border-top:1px solid var(--line);padding:10px 0}
.pi:first-child{border-top:0}
.pi .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pi .top b{font-size:17px}
.pi .kg{font-weight:800;white-space:nowrap;color:var(--br)}
.pi .s{font-size:13.5px;color:var(--sub)}
.pi .ed{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin-top:8px;align-items:end}
.lk{border:0;background:none;color:var(--blu);font:inherit;font-size:13.5px;font-weight:700;text-decoration:underline;padding:4px 0;cursor:pointer}
#olBg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.olBox{background:#fff;border-radius:18px;padding:18px;max-width:640px;width:100%;margin:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2B2622;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:.95}
.nw{white-space:nowrap}
@media (max-width:620px){
 .res .big{font-size:38px}
 .kp{grid-template-columns:1fr 1fr}
 .row3{grid-template-columns:1fr 1fr}
 .ing thead{display:none}
 .ing tr{display:grid;grid-template-columns:1fr 1fr 44px;gap:4px 6px;border-top:1px solid var(--line);padding:8px 0}
 .ing td{padding:0}
 .ing td.n{grid-column:1/3;width:auto}
 .ing td.x{grid-column:3;grid-row:1}
 .ing td.g,.ing td.p{width:auto}
 .ing td.a{grid-column:1/4;text-align:left;padding-top:0;width:auto}
 .pi .ed{grid-template-columns:1fr 1fr}
}
@media print{
 header,nav,.noprint,.xb,.presets,#toast{display:none!important}
 body{background:#fff;font-size:13px}
 main{padding:0;max-width:none}
 .card,.res{break-inside:avoid;border-color:#bbb;padding:10px;margin-bottom:8px}
 input,select{border:0;padding:0;min-height:0;font-size:13px;background:none}
 .res .big{font-size:30px}
}
</style>
</head>
<body>
<header><div class="hd">
 <h1>🧮 원가 계산기</h1>
 <div class="s">빵을그리다 생산실 · 로스·인건비까지 넣은 현실 원가</div>
 <nav>
  <button data-tab="calc">계산하기</button>
  <button data-tab="list">저장한 제품</button>
  <button data-tab="price">단가표</button>
 </nav>
</div></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const APP_VER='v002', APP_BUILT='2026-10-29';
const LSK='drawbread_cost_key', LSP='drawbread_cost_prices';
let PD=null, PSTAT='loading';
try{const c=JSON.parse(localStorage.getItem(LSP)||'null');if(c&&c.data)PD=c.data}catch(e){}
(function(){const m=location.hash.match(/[#&]k=([A-Za-z0-9_-]{10,})/);if(m){try{localStorage.setItem(LSK,m[1])}catch(e){}history.replaceState(null,'',location.pathname+location.search)}})();
const priceBase=()=>PD?`이카운트 최근 매입가 (${PD.snap} 06:30 자료)`:'단가표 없음';
const LS='drawbread_cost_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=v=>(isFinite(v)?Math.round(v):0).toLocaleString('ko-KR')+'원';
const num=(v,d=0)=>(isFinite(v)?(+v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0}):'0');
const N=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:0};
const FLOUR=/밀가루|강력|박력|중력|블레소레이유|T65|쌀가루|현미가루|통밀|호밀/;

function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blank(){return {id:uid(),name:'새 제품',pieceW:100,box:1,price:'',target:35,rawLoss:1,doughLoss:2,scrap:'drop',defect:3,people:1,minutes:60,batches:1,wage:13000,ohPct:5,logi:0,rows:[{n:'',g:''},{n:'',g:''},{n:'',g:''}],packs:[],memo:'',updated:Date.now()}}
function samples(){
 const a=blank();Object.assign(a,{name:'피자도우 260g',pieceW:260,box:1,minutes:40,
  rows:[{n:'코끼리강력밀가루(면세)',g:4000},{n:'꽃소금',g:80},{n:'물',g:2640},{n:'고당 드라이이스트(효모)',g:15},{n:'올리브유-포마스',g:50},{n:'잡화벌꿀',g:20}],
  memo:'생산실 원가표(10/29) 배합. 인건비 1명 40분은 예시 값'});
 const b=blank();Object.assign(b,{name:'굴뚝빵 생지 115g',pieceW:115,box:30,price:39000,
  rows:[{n:'K-블레소레이유',g:1200},{n:'프랑스밀가루T65',g:220},{n:'게랑드 소금',g:30},{n:'고당 드라이이스트(효모)',g:20},{n:'하얀설탕(큐원)',g:100},{n:'코코넛슈가',g:30},{n:'S-500개량제',g:38},{n:'계란 대란 (껍질 뺀 50g/개)',g:200},{n:'맑은식용유(큐원)',g:60},{n:'이즈니 고메버터',g:420},{n:'우유',g:800}],
  memo:'10/26 원가보고 배합. 판매가는 이카운트 DBS31 30개 39,000원. 인건비 1명 60분은 예시 값'});
 return [a,b];
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&Array.isArray(s.products)&&s.products.length){s.prices=s.prices||{};s.packs=s.packs||{};return s}}catch(e){}
 const p=samples();return {products:p,prices:{},packs:{},cur:p[0].id,tab:'calc'}}
let S=load();
let saveT=null;
function save(quiet){S.tab=S.tab||'calc';try{localStorage.setItem(LS,JSON.stringify(S));if(!quiet)toast('자동 저장됨')}catch(e){toast('저장 실패: 기기 저장 공간을 확인해 주세요')}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(true),500)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function cur(){let p=S.products.find(x=>x.id===S.cur);if(!p){p=S.products[0];S.cur=p.id}return p}

/* 단가: 이카운트 최근 매입가(암호 파일) + 이 기기에서 고친 값·온라인 조회 값 */
function mergeP(base,store){
 const m=new Map();
 base.forEach(x=>m.set(x.n,{...x,base:1}));
 Object.entries(store).forEach(([n,o])=>{if(o.del){m.delete(n);return}const b=m.get(n);
  if(b&&b.src==='buy'&&b.d&&o.at&&b.d>String(o.at).slice(0,10)){b.staleOv=o;return}
  m.set(n,{...(b||{n,s:'직접 추가'}),...o,n,edited:!!b,custom:!b,ecount:b&&b.src==='buy'?b:null})});
 return [...m.values()];
}
const ingAll=()=>mergeP((PD&&PD.ing)||[{n:'물',p:0,g:1000,src:'fix',s:'0원'}],S.prices);
const packAll=()=>mergeP((PD&&PD.pack)||[],S.packs);
let ING_MAP,PACK_MAP,CODE_MAP;
function refreshMaps(){ING_MAP=new Map(ingAll().map(x=>[x.n,x]));PACK_MAP=new Map(packAll().map(x=>[x.n,x]));
 CODE_MAP=new Map();((PD&&PD.ing)||[]).forEach(x=>{if(x.c)CODE_MAP.set(x.c,x.n)});((PD&&PD.pack)||[]).forEach(x=>{if(x.c)CODE_MAP.set('P:'+x.c,x.n)});
 migrate()}
function migrate(){(S.products||[]).forEach(p=>{(p.rows||[]).forEach(x=>{if(x.c&&CODE_MAP.has(x.c))x.n=CODE_MAP.get(x.c);else if(x.n){const it=ING_MAP.get(x.n);if(it&&it.c)x.c=it.c}});
 (p.packs||[]).forEach(x=>{if(x.c&&CODE_MAP.has('P:'+x.c))x.n=CODE_MAP.get('P:'+x.c);else if(x.n){const it=PACK_MAP.get(x.n);if(it&&it.c)x.c=it.c}})})}
async function decryptP(j,pw){
 const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(j.salt),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.iv)},key,ub(j.ct))));
}
async function loadPrices(force){
 let key=null;try{key=localStorage.getItem(LSK)}catch(e){}
 if(!key){PSTAT='nokey';return false}
 try{
  const j=await (await fetch('cost_prices.enc.json?t='+Date.now(),{cache:'no-store'})).json();
  let c=null;try{c=JSON.parse(localStorage.getItem(LSP)||'null')}catch(e){}
  if(!force&&c&&c.updated===j.updated&&c.data){PD=c.data;PSTAT='ok';return false}
  const data=await decryptP(j,key);PD=data;try{localStorage.setItem(LSP,JSON.stringify({updated:j.updated,data}))}catch(e){}
  PSTAT='ok';return true;
 }catch(e){PSTAT=(e&&e.name==='OperationError')?'badkey':(PD?'offline':'fail');return false}
}
function priceBanner(){
 if(PSTAT==='ok'||PSTAT==='loading')return '';
 const t={nokey:'단가표가 잠겨 있어요. 조조가 드린 「원가계산기 열쇠 링크」(QR)로 이 기기에서 한 번 열어 주세요. 그 전에는 가격을 직접 넣어 계산할 수 있어요.',
  badkey:'열쇠가 맞지 않아 단가표를 열지 못했어요. 열쇠 링크로 다시 열어 주세요.',
  offline:'인터넷이 안 돼서 이 기기에 저장된 지난 단가표를 쓰고 있어요.',fail:'단가표를 받지 못했어요. 인터넷 연결을 확인해 주세요.'}[PSTAT]||'';
 return `<div class="note noprint" style="margin:0 0 14px">${t}</div>`;
}
refreshMaps();
const autoKp=n=>{const x=ING_MAP.get(n);return x&&N(x.g)>0?N(x.p)/N(x.g)*1000:null};
const kpOf=r=>(r.kp!=null&&r.kp!=='')?N(r.kp):autoKp(r.n);
const autoUp=n=>{const x=PACK_MAP.get(n);return x?N(x.p)/(N(x.k)||1):null};
const upOf=p=>(p.up!=null&&p.up!=='')?N(p.up):autoUp(p.n);

/* 계산 */
function calc(r){
 const rows=(r.rows||[]).filter(x=>x.n&&N(x.g)>0);
 let mat=0,dough=0,flour=0;const miss=[];
 rows.forEach(x=>{const g=N(x.g),k=kpOf(x);dough+=g;if(FLOUR.test(x.n))flour+=g;if(k==null)miss.push(x.n);else mat+=g*k/1000});
 const W=N(r.pieceW),box=Math.max(1,N(r.box)||1);
 const ideal=W>0?dough/W:0;
 const usable=dough*(1-N(r.doughLoss)/100);
 const frac=W>0?usable/W:0;
 const pcs=r.scrap==='reuse'?frac:Math.floor(frac+1e-9);
 const good=pcs*(1-N(r.defect)/100);
 const matL=mat*N(r.rawLoss)/100;
 const bat=Math.max(1,N(r.batches)||1);const labor=N(r.people)*N(r.minutes)/60*N(r.wage)/bat;
 const oh=mat*N(r.ohPct)/100;
 let packPc=0;const pmiss=[];
 (r.packs||[]).forEach(p=>{if(!p.n)return;const u=upOf(p),q=N(p.q);if(u==null){pmiss.push(p.n);return}packPc+=p.per==='box'?u*q/box:u*q});
 const logiPc=N(r.logi)/box;
 const d=(a,b)=>b>0?a/b:0;
 const A=d(mat,ideal),B=d(mat+matL,ideal),C1=d(mat+matL,frac),C=d(mat+matL,pcs),D=d(mat+matL,good),E=d(mat+matL+labor,good),F=d(mat+matL+labor+oh,good);
 const total=F+packPc+logiPc;
 return {mat,dough,flour,ideal,usable,frac,pcs,good,matL,labor,oh,packPc,logiPc,A,B,C1,C,D,E,F,total,box,boxCost:total*box,batch:mat+matL+labor+oh,miss,pmiss,W};
}

/* 화면 */
function setTab(t){S.tab=t;save(true);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 if(S.tab==='list')renderList();else if(S.tab==='price')renderPrice();else renderCalc();
 window.scrollTo(0,0);
}

function numIn(k,v,ph,step){return `<input type="number" inputmode="decimal" step="${step||'any'}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph||'')}">`}
function presets(k,vals,v,unit){return `<div class="presets">${vals.map(x=>`<button type="button" data-pre="${k}" data-v="${x}" class="${N(v)===x?'on':''}">${x}${unit}</button>`).join('')}</div>`}

function renderCalc(){
 const r=cur();
 const opts=S.products.map(p=>`<option value="${p.id}" ${p.id===r.id?'selected':''}>${esc(p.name)}</option>`).join('');
 $('#app').innerHTML=priceBanner()+`

function srcLine(it){
 if(!it)return '';
 if(it.src==='online')return `온라인 ${esc((it.at||'').slice(5,10).replace('-','/'))} · ${esc(it.mall||'')}`;
 if(it.edited||it.custom)return '이 기기에서 고친 값';
 if(it.src==='buy')return `이카운트 ${esc((it.d||'').slice(2).replace(/-/g,'.'))} 매입${it.prev?(it.p>it.prev?' <b style="color:var(--red)">▲'+num((it.p/it.prev-1)*100)+'%</b>':' <b style="color:var(--grn)">▼'+num((1-it.p/it.prev)*100)+'%</b>'):''}`;
 if(it.src==='stock')return '이카운트 재고 단가 (최근 매입 없음)';
 if(it.src==='est')return '추정값';
 return '';
}
function hintHtml(x,i){
 const ak=autoKp(x.n),ov=x.kp!=null&&x.kp!=='',it=ING_MAP.get(x.n);
 const ob=`<button type="button" class="lk noprint" data-online="${i}">🔎 쿠팡·네이버에서 찾기</button>`;
 if(x.n&&!it&&!ov)return `<span class="ps" style="color:var(--org)">이카운트에 없는 재료 · ${ob}</span>`;
 if(ov)return `<span class="ps">이번만 직접 넣은 가격${ak!=null?` (단가표 ${num(ak)}원)`:''}</span>`;
 if(it&&it.staleOv)return `<span class="ps">${srcLine(it)} · 고친 값보다 최근이라 매입가를 씀</span>`;
 if(it&&it.chk&&it.src!=='online'&&!it.edited)return `<span class="ps" style="color:var(--org)">${srcLine(it)} · 확인 필요 · ${ob}</span>`;
 if(it)return `<span class="ps">${srcLine(it)}</span>`;
 return '';
}
function rowHint(tr,x){if(!tr||!x)return;const td=tr.querySelector('td.n');td.querySelectorAll('.ps').forEach(e=>e.remove());td.insertAdjacentHTML('beforeend',hintHtml(x,+tr.dataset.row))}
function ingRow(x,i){
 const k=kpOf(x),ps=hintHtml(x,i);
 return `<tr data-row="${i}">
  <td class="n"><input list="dlIng" data-f="n" value="${esc(x.n)}" placeholder="재료 이름">${ps}</td>
  <td class="g"><input type="number" inputmode="decimal" data-f="g" value="${esc(x.g)}" placeholder="g"><span class="bp" data-bp="${i}"></span></td>
  <td class="p"><input type="number" inputmode="decimal" data-f="kp" value="${esc(k!=null?Math.round(k):'')}" class="${x.n&&k==null?'miss':''}" placeholder="1kg 가격"></td>
  <td class="a" data-amt="${i}"></td>
  <td class="x"><button class="xb" data-delrow="${i}" title="빼기">×</button></td></tr>`;
}
function packRow(p,i){
 const u=upOf(p);
 return `<div class="pi" data-pack="${i}">
  <input list="dlPack" data-pf="n" value="${esc(p.n)}" placeholder="포장재 이름 (예: OPP 봉투)">
  <div class="ed" style="grid-template-columns:1fr 1fr 1.3fr 44px">
   <div><label class="f">수량</label><input type="number" inputmode="decimal" data-pf="q" value="${esc(p.q)}"></div>
   <div><label class="f">1개 단가(원)</label><input type="number" inputmode="decimal" data-pf="up" value="${esc(u!=null?Math.round(u*100)/100:'')}" class="${p.n&&u==null?'miss':''}"></div>
   <div><label class="f">기준</label><select data-pf="per"><option value="pc" ${p.per!=='box'?'selected':''}>빵 1개당</option><option value="box" ${p.per==='box'?'selected':''}>1봉·1박스당</option></select></div>
   <div><button class="xb" data-delpack="${i}" style="margin-top:30px">×</button></div>
  </div></div>`;
}
function bindCalc(){
 const r=cur(),app=$('#app');
 $('#pick').onchange=e=>{S.cur=e.target.value;save(true);renderCalc()};
 $('#bNew').onclick=()=>{const p=blank();S.products.push(p);S.cur=p.id;save();renderCalc()};
 $('#bCopy').onclick=()=>{const p=JSON.parse(JSON.stringify(r));p.id=uid();p.name=r.name+' (복사)';p.updated=Date.now();S.products.push(p);S.cur=p.id;save();renderCalc();toast('복사했어요')};
 $('#bPrint').onclick=()=>window.print();
 $('#bDel').onclick=()=>{if(!confirm(`「${r.name}」을(를) 삭제할까요?`))return;S.products=S.products.filter(x=>x.id!==r.id);if(!S.products.length)S.products.push(blank());S.cur=S.products[0].id;save();renderCalc()};
 $('#bAddRow').onclick=()=>{r.rows.push({n:'',g:''});touch();renderCalcKeep()};
 $('#bAddPack').onclick=()=>{r.packs=r.packs||[];r.packs.push({n:'',q:1,per:'pc'});touch();renderCalcKeep()};
 app.oninput=e=>{
  const t=e.target;
  if(t.dataset.k){r[t.dataset.k]=t.type==='number'?t.value:t.value;if(t.dataset.k==='name')refreshPick();syncPresets(t.dataset.k);touch();update();return}
  const tr=t.closest('[data-row]');
  if(tr&&t.dataset.f){const x=r.rows[+tr.dataset.row];
   if(t.dataset.f==='kp'){const ak=autoKp(x.n);x.kp=(t.value===''||(ak!=null&&Math.abs(N(t.value)-ak)<0.5))?null:t.value;rowHint(tr,x)}
   else x[t.dataset.f]=t.value;
   if(t.dataset.f==='n'){x.kp=null;const it0=ING_MAP.get(x.n);x.c=it0&&it0.c||undefined;const k=autoKp(x.n);const pin=tr.querySelector('[data-f=kp]');pin.value=k!=null?Math.round(k):'';pin.classList.toggle('miss',!!x.n&&k==null)}
   touch();update();return}
  const pi=t.closest('[data-pack]');
  if(pi&&t.dataset.pf){const p=r.packs[+pi.dataset.pack];
   if(t.dataset.pf==='up'){const au=autoUp(p.n);p.up=(t.value===''||(au!=null&&Math.abs(N(t.value)-au)<0.005))?null:t.value}
   else p[t.dataset.pf]=t.value;
   if(t.dataset.pf==='n'){p.up=null;const it1=PACK_MAP.get(p.n);p.c=it1&&it1.c||undefined;const u=autoUp(p.n);const uin=pi.querySelector('[data-pf=up]');uin.value=u!=null?Math.round(u*100)/100:''}
   touch();update();return}
 };
 app.onchange=e=>{const t=e.target;if(t.dataset.f==='n'){const tr=t.closest('[data-row]');rowHint(tr,r.rows[+tr.dataset.row])}};
 app.onclick=e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pre){r[t.dataset.pre]=+t.dataset.v;const inp=app.querySelector(`[data-k="${t.dataset.pre}"]`);if(inp)inp.value=t.dataset.v;syncPresets(t.dataset.pre);touch();update()}
  else if(t.dataset.scrap){r.scrap=t.dataset.scrap;app.querySelectorAll('[data-scrap]').forEach(b=>b.classList.toggle('on',b===t));touch();update()}
  else if(t.dataset.delrow!=null){r.rows.splice(+t.dataset.delrow,1);if(!r.rows.length)r.rows.push({n:'',g:''});touch();renderCalcKeep()}
  else if(t.dataset.delpack!=null){r.packs.splice(+t.dataset.delpack,1);touch();renderCalcKeep()}
  else if(t.dataset.online!=null){const x=r.rows[+t.dataset.online];openOnline(x.n,(name)=>{x.n=name;x.kp=null;const it2=ING_MAP.get(name);x.c=it2&&it2.c||undefined;touch();renderCalcKeep()})}
 };
}
function renderCalcKeep(){const y=window.scrollY;renderCalc();window.scrollTo(0,y)}
function refreshPick(){const o=$('#pick').selectedOptions[0];if(o)o.textContent=cur().name}
function syncPresets(k){const v=N(cur()[k]);document.querySelectorAll(`[data-pre="${k}"]`).forEach(b=>b.classList.toggle('on',N(b.dataset.v)===v&&cur()[k]!==''))}
function touch(){cur().updated=Date.now();saveSoon()}

function update(){
 const r=cur(),c=calc(r);
 // 배합 행
 r.rows.forEach((x,i)=>{const a=document.querySelector(`[data-amt="${i}"]`),bp=document.querySelector(`[data-bp="${i}"]`);
  const k=kpOf(x),g=N(x.g);if(a)a.textContent=x.n&&g>0?(k==null?'단가 없음':won(g*k/1000)):'';
  if(bp)bp.textContent=c.flour>0&&g>0?num(g/c.flour*100,1)+'%':''});
 $('#sDough').textContent=`${num(c.dough)}g`;
 $('#sMat').textContent=won(c.mat);
 // 결과
 const price=N(r.price),tgt=N(r.target)||35;
 const rate=price>0?c.boxCost/price*100:null;
 const rec=c.boxCost/(tgt/100);
 const diff=c.total-c.A;
 let warn='';
 if(!(c.W>0))warn='1개 분할 무게를 넣어 주세요.';
 else if(c.dough<=0)warn='배합에 재료와 사용량을 넣어 주세요.';
 else if(c.good<=0)warn='반죽이 1개 분할 무게보다 적어요. 무게나 배합을 확인해 주세요.';
 const boxLbl=c.box>1?`1봉·1박스(${num(c.box)}개)`:'1개';
 $('#res').innerHTML=`
  <div class="lbl">${esc(r.name)} · 1개 현실 원가</div>
  <div class="big">${num(c.total)}<small>원</small></div>
  <div class="cmp">재료만 계산하면 <b class="nw">${num(c.A,1)}원</b> → 현실 원가는 <b class="nw" style="color:var(--red)">+${num(diff)}원 (+${num(c.A>0?diff/c.A*100:0)}%)</b></div>
  <div class="kp">
   <div><span>${boxLbl} 원가</span><b>${won(c.boxCost)}</b></div>
   <div><span>권장 판매가 (원가율 ${num(tgt)}%)</span><b>${won(rec)}</b></div>
   <div><span>지금 판매가 원가율</span><b style="color:${rate==null?'var(--sub)':rate>tgt+5?'var(--red)':rate>tgt?'var(--org)':'var(--grn)'}">${rate==null?'판매가 없음':num(rate,1)+'%'}</b></div>
   <div><span>재료+로스만 (인건비 빼고)</span><b>${won(c.D)}</b></div>
   <div><span>실제 나오는 좋은 제품</span><b>${num(c.good,1)}개</b></div>
   <div><span>1배합 총원가</span><b>${won(c.batch)}</b></div>
  </div>
  ${price>0?`<div class="info">판매가 ${won(price)} − 원가 ${won(c.boxCost)} = ${boxLbl} 남는 돈 <b class="nw">${won(price-c.boxCost)}</b> (1개 ${won((price-c.boxCost)/c.box)})</div>`:''}
  ${warn?`<div class="warn">${warn}</div>`:''}
  ${c.miss.length?`<div class="note">단가가 없는 재료: ${c.miss.map(esc).join(', ')} → 0원으로 계산됨. 1kg 가격을 넣어 주세요.</div>`:''}
  ${c.pmiss.length?`<div class="note">단가가 없는 포장재: ${c.pmiss.map(esc).join(', ')}</div>`:''}`;
 // 폭포
 const steps=[
  ['재료비만 (생산실 계산 방식)',`재료비 ${won(c.mat)} ÷ 반죽 전부 나눈 개수 ${num(c.ideal,2)}개`,c.A,'#8D6E63',true],
  ['원료 손실',`보관·계량·유통기한 폐기 ${num(N(r.rawLoss),1)}%`,c.B-c.A,'#E07B00'],
  ['반죽 손실',`믹서·작업대에 남는 반죽 ${num(N(r.doughLoss),1)}% → ${num(c.frac,2)}개`,c.C1-c.B,'#E07B00'],
  ['자투리 반죽',r.scrap==='reuse'?'다음 반죽에 다시 씀 (추가 없음)':`버림 → ${num(c.pcs)}개로 내림`,c.C-c.C1,'#E07B00'],
  ['불량·폐기',`${num(N(r.defect),1)}% → 좋은 제품 ${num(c.good,1)}개`,c.D-c.C,'#C62828'],
  ['인건비',`${num(N(r.people),1)}명 × ${num(N(r.minutes))}분 × 1시간 ${won(N(r.wage))}${N(r.batches)>1?` ÷ ${num(N(r.batches))}배합`:''} = 1배합 ${won(c.labor)}`,c.E-c.D,'#1E5AA8'],
  ['전기·가스·수도 등',`재료비의 ${num(N(r.ohPct),1)}% = ${won(c.oh)}`,c.F-c.E,'#1E5AA8'],
  ['포장재',(r.packs||[]).filter(p=>p.n).length?`${(r.packs||[]).filter(p=>p.n).length}가지`:'없음',c.packPc,'#6A4C93'],
  ['배송비',N(r.logi)>0?`1봉·1박스 ${won(N(r.logi))} ÷ ${num(c.box)}개`:'없음',c.logiPc,'#6A4C93'],
 ];
 const mx=Math.max(c.total,1);let acc=0;
 $('#wf').innerHTML=`<div class="wf">${steps.map(([t,s,v,col,first])=>{const left=first?0:acc/mx*100,w=Math.max(0,v)/mx*100;acc+=v;
   return `<div class="t">${t}<small>${s}</small></div><div class="v">${first?'':'+'}${num(v,1)}원</div><div class="bk"><i style="left:${left}%;width:${w}%;background:${col}"></i></div>`}).join('')}
  <div class="t tot">= 1개 현실 원가</div><div class="v tot">${num(c.total,1)}원</div></div>`;
}

/* 제품 목록 */
function renderList(){
 const items=S.products.map(p=>{const c=calc(p);return `<div class="it" data-open="${p.id}"><div class="m"><b>${esc(p.name)}</b><span>${num(p.pieceW)}g · 재료만 ${num(c.A)}원 · ${new Date(p.updated||0).toLocaleDateString('ko-KR')} 수정</span></div><div class="r">${num(c.total)}원<br><span style="font-size:13px;color:var(--sub);font-weight:400">1개 현실 원가</span></div></div>`}).join('');
 $('#app').innerHTML=`
 <div class="card"><h2>저장한 제품 (${S.products.length}개)</h2><p class="help">누르면 계산 화면으로 열려요. 고친 내용은 자동 저장돼요.</p>${items}
  <button class="btn" id="lNew" style="width:100%;margin-top:10px">+ 새 제품 만들기</button></div>
 <div class="card"><h2>다른 기기로 옮기기</h2>
  <p class="help">저장 내용은 <b>이 기기(이 브라우저)에만</b> 남아요. 태블릿에서 만든 제품을 PC에서 보려면 파일로 내보낸 뒤 PC에서 가져오기 하세요.</p>
  <div class="bar"><button class="btn g" id="lExp">파일로 내보내기</button><button class="btn g" id="lImp">파일 가져오기</button><input type="file" id="lFile" accept=".json,application/json" style="display:none"></div></div>
 <div class="card"><h2>처음 예시로 되돌리기</h2><p class="help">예시 제품(피자도우, 굴뚝빵)만 다시 넣어요. 내가 만든 제품은 지우지 않아요.</p>
  <button class="btn gr" id="lSample">예시 제품 다시 넣기</button></div>
 <p class="help" style="text-align:center">원가 계산기 ${APP_VER} · ${APP_BUILT}</p>`;
 document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{S.cur=e.dataset.open;setTab('calc')});
 $('#lNew').onclick=()=>{const p=blank();S.products.push(p);S.cur=p.id;setTab('calc')};
 $('#lSample').onclick=()=>{S.products.push(...samples());save();renderList();toast('예시 제품을 넣었어요')};
 $('#lExp').onclick=()=>{const blob=new Blob([JSON.stringify({app:'drawbread_cost',ver:APP_VER,at:new Date().toISOString(),products:S.products,prices:S.prices,packs:S.packs},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date();a.download=`원가계산기_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
 $('#lImp').onclick=()=>$('#lFile').click();
 $('#lFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='drawbread_cost'||!Array.isArray(j.products))throw 0;
   let add=0,upd=0;j.products.forEach(p=>{const i=S.products.findIndex(x=>x.id===p.id);if(i<0){S.products.push(p);add++}else if((p.updated||0)>(S.products[i].updated||0)){S.products[i]=p;upd++}});
   Object.assign(S.prices,j.prices||{});Object.assign(S.packs,j.packs||{});refreshMaps();save(true);renderList();toast(`새 제품 ${add}개, 최신으로 바뀐 제품 ${upd}개`)}catch(_){alert('원가 계산기에서 내보낸 파일이 아니에요.')}};
}

/* 단가표 */
let PQ='',PT='ing';
function renderPrice(){
 const cnt=PD?PD.ing.filter(x=>x.src==='buy').length:0;
 $('#app').innerHTML=priceBanner()+`
 <div class="card"><h2>단가표</h2>
  <p class="help">${PD?`<b>${esc(priceBase())}</b> · 이카운트 매입가 ${num(cnt)}개 · 포장재 ${num(PD.pack.length)}개. 매일 아침 자동으로 새 매입가가 들어와요.`:'아직 단가표를 받지 않았어요.'}
   모든 값은 공급가(부가세 별도)예요. <span class="chip o">확인 필요</span>는 최근 매입 기록이 없는 품목이에요.</p>
  <div class="bar noprint" style="margin-bottom:10px"><button class="btn g sm" id="pReload">↻ 단가표 다시 받기</button></div>
  <div class="seg" style="margin-bottom:10px"><button type="button" data-pt="ing" class="${PT==='ing'?'on':''}">원료</button><button type="button" data-pt="dough" class="${PT==='dough'?'on':''}">생지</button><button type="button" data-pt="pack" class="${PT==='pack'?'on':''}">포장재</button></div>
  <input id="pq" placeholder="찾기 (예: 버터, 소금)" value="${esc(PQ)}">
  <div id="plist" style="margin-top:6px"></div></div>
 <div class="card"><h2>이카운트에 없는 품목 추가</h2>
  <p class="help">쿠팡·네이버쇼핑에서 찾아 고르거나, 아는 가격을 직접 넣으세요.</p>
  <label class="f">이름</label><input id="nN" placeholder="${PT==='pack'?'예: 피자 박스':'예: 엑스트라버진 올리브오일'}">
  ${PT!=='pack'?'<button class="btn" id="nOnline" style="width:100%;margin-top:10px">🔎 쿠팡·네이버에서 찾아서 추가</button><p class="help" style="margin:10px 0 0">또는 직접 넣기</p>':''}
  <div class="row2"><div><label class="f">포장 가격 (원, 부가세 빼고)</label><input id="nP" type="number" inputmode="decimal"></div>
  <div><label class="f">${PT!=='pack'?'포장 무게 (g)':'포장 안 개수'}</label><input id="nG" type="number" inputmode="decimal" placeholder="${PT!=='pack'?'예: 1000':'예: 100'}"></div></div>
  <button class="btn g" id="nAdd" style="width:100%;margin-top:12px">직접 넣어 추가하기</button></div>`;
 document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PT=b.dataset.pt;renderPrice()});
 $('#pq').oninput=e=>{PQ=e.target.value;drawP()};
 $('#pReload').onclick=async()=>{toast('단가표 받는 중…');const ch=await loadPrices(true);refreshMaps();renderPrice();toast(PSTAT==='ok'?'최신 단가표예요':'받지 못했어요')};
 if($('#nOnline'))$('#nOnline').onclick=()=>{const n=$('#nN').value.trim();openOnline(n,(name)=>{PQ=name;renderPrice()})};
 $('#nAdd').onclick=()=>{const n=$('#nN').value.trim(),p=N($('#nP').value),g=N($('#nG').value);if(!n||!(g>0)){alert('이름과 '+(PT!=='pack'?'포장 무게':'개수')+'를 넣어 주세요.');return}
  const at=new Date().toISOString();
  if(PT!=='pack')S.prices[n]={p,g,s:'직접 추가',at};else S.packs[n]={p,k:g,s:'직접 추가',at};
  refreshMaps();save();PQ=n;renderPrice()};
 drawP();
}
function drawP(){
 const isP=PT==='pack';
 let list=(isP?[...PACK_MAP.values()]:[...ING_MAP.values()].filter(x=>PT==='dough'?x.cat==='생지':x.cat!=='생지'));
 const q=PQ.trim();if(q)list=list.filter(x=>x.n.includes(q)||(x.n0||'').includes(q)||(x.c||'').includes(q));
 list.sort((a,b)=>(a.src==='fix')-(b.src==='fix')||a.n.localeCompare(b.n,'ko'));
 const shown=list.slice(0,q?200:80);
 $('#plist').innerHTML=(list.length>shown.length?`<p class="help">${num(list.length)}개 중 ${shown.length}개만 보여요. 찾기 칸에 이름을 넣으세요.</p>`:'')+shown.map(x=>{
  const unit=!isP?(N(x.g)>0?`1kg ${num(N(x.p)/N(x.g)*1000)}원`:'-'):`1개 ${num(N(x.p)/(N(x.k)||1),1)}원`;
  const pack=!isP?`${num(x.g)}g ${won(x.p)}`:`${num(x.k||1)}개 ${won(x.p)}`;
  const chips=(x.chk&&!x.edited&&x.src!=='online'?'<span class="chip o">확인 필요</span> ':'')+(x.src==='online'?'<span class="chip b">온라인</span> ':'')+(x.edited&&x.src!=='online'?'<span class="chip g">고침</span> ':'')+(x.custom&&x.src!=='online'?'<span class="chip b">추가</span> ':'');
  const sub=[srcLine(x),x.cust&&x.src==='buy'?esc(x.cust):'',x.prev&&x.src==='buy'?`직전 ${won(x.prev)}`:'',x.s&&x.src!=='buy'?esc(x.s):'',x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">상품 보기</a>`:''].filter(Boolean).join(' · ');
  return `<div class="pi" data-pn="${esc(x.n)}"><div class="top"><div><b>${esc(x.n)}</b> ${chips}
   <div class="s">${pack} · ${sub}</div>${x.staleOv?'<div class="s" style="color:var(--blu)">이 기기에서 고친 값이 있었지만, 그 뒤 이카운트 매입가가 새로 들어와서 매입가를 써요.</div>':''}</div><div class="kg">${unit}</div></div>
   <div class="ed"><div><label class="f" style="font-size:14px">포장 가격(원)</label><input type="number" inputmode="decimal" data-pe="p" value="${esc(x.p)}"></div>
   <div><label class="f" style="font-size:14px">${!isP?'포장 무게(g)':'포장 안 개수'}</label><input type="number" inputmode="decimal" data-pe="${!isP?'g':'k'}" value="${esc(!isP?x.g:(x.k||1))}"></div>
   <button class="btn sm" data-psave>저장</button>${x.edited||x.custom?`<button class="btn gr sm" data-preset>${x.custom?'삭제':'매입가로'}</button>`:(!isP&&x.src!=='buy'&&x.src!=='fix'?'<button class="btn g sm" data-pon>🔎 찾기</button>':'<span></span>')}</div></div>`}).join('')||'<p class="help">찾는 품목이 없어요. 아래에서 추가하세요.</p>';
 $('#plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const pi=b.closest('[data-pn]'),n=pi.dataset.pn,store=isP?S.packs:S.prices;
  if(b.hasAttribute('data-psave')){const p=N(pi.querySelector('[data-pe=p]').value),qq=N(pi.querySelector(`[data-pe=${!isP?'g':'k'}]`).value);if(!(qq>0)){alert('무게(개수)를 넣어 주세요.');return}
   const o={p,s:'직접 고침',at:new Date().toISOString()};if(!isP)o.g=qq;else o.k=qq;store[n]=o;refreshMaps();save();drawP()}
  else if(b.hasAttribute('data-preset')){delete store[n];refreshMaps();save();drawP()}
  else if(b.hasAttribute('data-pon')){openOnline(n,()=>drawP())}};
}

/* 온라인 조회 (쿠팡·네이버쇼핑 검색창 열기 → 고른 상품 붙여넣기) */
function parseShop(t){
 t=String(t||'');const o={};
 const u=t.match(/https?:\/\/[^\s<>"']+/);if(u)o.url=u[0];
 o.mall=/coupang/i.test(t)||/쿠팡/.test(t)?'쿠팡':/naver|네이버|smartstore/i.test(t)?'네이버쇼핑':/11st|11번가/i.test(t)?'11번가':/gmarket|지마켓/i.test(t)?'G마켓':'';
 let title=t.replace(/https?:\/\/[^\s]+/g,'').replace(/\[(쿠팡|네이버[^\]]*)\]/g,'').split(/\n/).map(s=>s.trim()).filter(s=>s&&!/^(쿠팡|공유|링크)/.test(s))[0]||'';
 o.title=title.replace(/\s*(\d{1,3}(?:,\d{3})+|\d{3,7})\s*원.*$/,'').slice(0,120);
 const pr=[...t.matchAll(/(\d{1,3}(?:,\d{3})+|\d{3,7})\s*원/g)].map(m=>N(m[1]));if(pr.length)o.price=pr[0];
 o.g=parseQty(o.title||t);
 return o;
}
function parseQty(s){
 s=String(s||'');const U=(v,u)=>/kg|l|리터/i.test(u)?v*1000:v;
 let m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])\s*[x×*X]\s*(\d+)/i);if(m)return U(+m[1],m[2])*+m[3];
 m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])[^\d]{0,6}?(\d+)\s*(개|입|팩|병|봉|통|EA)/i);if(m)return U(+m[1],m[2])*+m[3];
 m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])/i);if(m)return U(+m[1],m[2]);
 return null;
}
function openOnline(name,done){
 name=name||'';
 const q0=name.replace(/\(.*?\)/g,'').replace(/[_]/g,' ').trim();
 const w=document.createElement('div');w.id='olBg';
 w.innerHTML=`<div class="olBox">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:20px">🔎 온라인에서 단가 찾기</h2><button class="xb" id="olX" style="color:var(--ink)">×</button></div>
  <label class="f">재료 이름 <small>(원가 계산에 쓰는 이름)</small></label><input id="olN" value="${esc(name)}" placeholder="예: 엑스트라버진 올리브오일">
  <label class="f">① 검색어</label><input id="olQ" value="${esc(q0)}">
  <div class="row2" style="margin-top:8px"><button class="btn" id="olC" style="background:#E3242B">쿠팡에서 찾기</button><button class="btn" id="olV" style="background:#03A94D">네이버쇼핑에서 찾기</button></div>
  <p class="help" style="margin-top:8px">새 창에서 상품을 고른 뒤 <b>공유 → 링크 복사</b>(또는 상품명·가격 복사)를 하고, 이 화면으로 돌아와 아래에 붙여 넣으세요.</p>
  <label class="f">② 고른 상품 붙여넣기</label><textarea id="olT" rows="3" style="width:100%;font:inherit;font-size:16px;border:1.5px solid #C9C1B8;border-radius:10px;padding:10px" placeholder="예: [쿠팡] 코끼리 올리브오일 엑스트라버진 1L x 2개 23,900원 https://link.coupang.com/..."></textarea>
  <label class="f">상품명</label><input id="olTi">
  <div class="row2">
   <div><label class="f">판매 가격 <small>(원, 묶음 전체)</small></label><input id="olP" type="number" inputmode="decimal"></div>
   <div><label class="f">배송비 <small>(원)</small></label><input id="olS" type="number" inputmode="decimal" value="0"></div>
   <div><label class="f">총 용량 <small>(g, 묶음 전체)</small></label><input id="olG" type="number" inputmode="decimal" placeholder="상품명에서 자동"></div>
   <div><label class="f">링크</label><input id="olU" placeholder="https://"></div>
  </div>
  <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:16px"><input type="checkbox" id="olVat" checked style="width:26px;min-height:26px;margin-top:2px"><span>부가세 빼고 계산 (가격 ÷ 1.1)<br><small style="color:var(--sub)">이카운트 매입가와 같은 기준. 밀가루·계란·채소처럼 가공하지 않은 농산물(면세)은 체크를 끄세요.</small></span></label>
  <div class="info" id="olR">가격과 용량을 넣으면 1kg 가격이 나와요.</div>
  <button class="btn" id="olOk" style="width:100%;margin-top:12px">이 가격으로 원가에 반영</button>
 </div>`;
 document.body.appendChild(w);
 const g=id=>w.querySelector('#'+id);
 const calcR=()=>{const p=N(g('olP').value)+N(g('olS').value),gg=N(g('olG').value),v=g('olVat').checked;
  if(p>0&&gg>0){const pp=v?p/1.1:p;g('olR').innerHTML=`포장 가격 <b>${won(pp)}</b>${v?' (부가세 뺀 값)':''} · 용량 ${num(gg)}g → <b>1kg ${num(pp/gg*1000)}원</b>`}else g('olR').textContent='가격과 용량을 넣으면 1kg 가격이 나와요.'};
 const close=()=>w.remove();
 g('olX').onclick=close;w.onclick=e=>{if(e.target===w)close()};
 g('olC').onclick=()=>window.open('https://www.coupang.com/np/search?q='+encodeURIComponent(g('olQ').value),'_blank');
 g('olV').onclick=()=>window.open('https://search.shopping.naver.com/search/all?query='+encodeURIComponent(g('olQ').value),'_blank');
 g('olT').oninput=()=>{const o=parseShop(g('olT').value);if(o.title)g('olTi').value=o.title;if(o.price)g('olP').value=o.price;if(o.g)g('olG').value=o.g;if(o.url)g('olU').value=o.url;w._mall=o.mall;calcR()};
 g('olTi').oninput=()=>{const q=parseQty(g('olTi').value);if(q&&!g('olG').value)g('olG').value=q;calcR()};
 ['olP','olS','olG','olVat'].forEach(id=>g(id).oninput=g(id).onchange=calcR);
 g('olOk').onclick=()=>{const n=g('olN').value.trim(),p=N(g('olP').value)+N(g('olS').value),gg=N(g('olG').value),v=g('olVat').checked;
  if(!n){alert('재료 이름을 넣어 주세요.');return}if(!(p>0)||!(gg>0)){alert('판매 가격과 총 용량을 넣어 주세요.');return}
  const url=g('olU').value.trim();const mall=w._mall||(/coupang/i.test(url)?'쿠팡':/naver/i.test(url)?'네이버쇼핑':'온라인');
  S.prices[n]={p:Math.round((v?p/1.1:p)*100)/100,g:gg,src:'online',mall,title:g('olTi').value.trim(),url,vat:v,at:new Date().toISOString(),s:`${mall} ${g('olTi').value.trim()}`.slice(0,90)};
  refreshMaps();save();close();toast('원가에 반영했어요');if(done)done(n)};
 setTimeout(()=>g(name?'olQ':'olN').focus(),50);
}

/* 시작: 저장된 단가표로 먼저 그리고, 새 단가표를 받으면 다시 그림 */
loadPrices(false).then(ch=>{refreshMaps();if(ch||PSTAT!=='ok')render()});
render();
</script>
</body>
