<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원가 계산기 · 빵을그리다</title>
<link rel="manifest" href="cost.webmanifest">
<link rel="icon" href="cost_192.png">
<link rel="apple-touch-icon" href="cost_apple.png">
<meta name="theme-color" content="#7A4A23">
<style>
:root{--br:#7A4A23;--br2:#A0693A;--brl:#F6EEE6;--bg:#F3F1EE;--ink:#1E1A17;--sub:#55504A;--line:#DED8D1;--red:#C62828;--redl:#FDECEC;--org:#D46A00;--orgl:#FFF3E0;--grn:#2E7D32;--grnl:#E8F5E9;--blu:#1E5AA8;--blul:#E8F0FB}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;overflow-wrap:break-word}
header{background:var(--br);color:#fff;padding:12px 14px 0;position:sticky;top:0;z-index:20}
.hd{max-width:900px;margin:0 auto}
header h1{margin:0;font-size:22px;letter-spacing:-.3px}
header .s{font-size:14px;opacity:.85}
nav{display:flex;gap:6px;margin-top:10px}
nav button{flex:1;min-height:52px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.16);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
nav button.on{background:var(--bg);color:var(--br)}
main{max-width:900px;margin:0 auto;padding:14px 12px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:19px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.card h2 .no{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--br);color:#fff;font-size:15px;align-items:center;justify-content:center;flex:none}
.help{color:var(--sub);font-size:15px;margin:2px 0 12px}
label.f{display:block;margin:10px 0 4px;font-weight:700;font-size:16px}
label.f small{font-weight:400;color:var(--sub)}
input,select{font:inherit;font-size:18px;color:var(--ink);border:1.5px solid #C9C1B8;border-radius:10px;padding:10px 12px;min-height:50px;width:100%;background:#fff}
input:focus,select:focus{outline:3px solid #E7C9A8;border-color:var(--br)}
input.miss{border-color:var(--org);background:var(--orgl)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{min-height:54px;border:0;border-radius:12px;padding:0 18px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;background:var(--br);color:#fff}
.btn.g{background:#fff;color:var(--br);border:1.5px solid var(--br)}
.btn.gr{background:#EEEAE5;color:var(--ink)}
.btn.sm{min-height:44px;font-size:15px;padding:0 12px}
.btn.del{background:#fff;color:var(--red);border:1.5px solid #E8B4B4}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar>select{flex:1;min-width:200px}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:2px 9px;vertical-align:middle}
.chip.o{background:var(--orgl);color:var(--org)}
.chip.g{background:var(--grnl);color:var(--grn)}
.chip.b{background:var(--blul);color:var(--blu)}
.chip.r{background:var(--redl);color:var(--red)}
/* 결과 */
.res{background:#fff;border:2px solid var(--br);border-radius:18px;padding:16px;margin-bottom:14px}
.res .lbl{font-size:16px;color:var(--sub);font-weight:700}
.res .big{font-size:44px;font-weight:800;color:var(--br);line-height:1.15;letter-spacing:-1px}
.res .big small{font-size:22px}
.res .cmp{font-size:16px;margin-top:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kp div{background:var(--brl);border-radius:12px;padding:10px}
.kp b{display:block;font-size:21px;white-space:nowrap}
.kp span{font-size:14px;color:var(--sub)}
.warn{background:var(--redl);color:var(--red);border-radius:10px;padding:10px 12px;font-weight:700;margin-top:10px}
.note{background:var(--orgl);color:#8A4500;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.info{background:var(--blul);color:#173F75;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
/* 폭포 */
.wf{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.wf .t{font-size:16px}
.wf .t small{display:block;color:var(--sub);font-size:13.5px;line-height:1.35}
.wf .v{font-weight:800;white-space:nowrap;text-align:right;font-size:17px}
.wf .bk{grid-column:1/3;height:10px;background:#EFEAE4;border-radius:6px;overflow:hidden;margin-bottom:8px;position:relative}
.wf .bk i{position:absolute;top:0;bottom:0;border-radius:6px}
.wf .tot{border-top:2px solid var(--ink);padding-top:8px;font-weight:800;font-size:18px}
/* 배합 표 */
.ing{width:100%;border-collapse:collapse}
.ing th{font-size:14px;color:var(--sub);text-align:left;font-weight:700;padding:4px 4px}
.ing td{padding:4px;vertical-align:top}
.ing td.n{width:38%}
.ing td.g{width:17%}
.ing td.p{width:21%}
.ing td.a{width:16%;text-align:right;font-weight:700;padding-top:16px;white-space:nowrap}
.ing td.x{width:44px}
.ing .bp{font-size:13px;color:var(--sub);display:block;text-align:right;margin-top:2px}
.ing .ps{font-size:12.5px;color:var(--sub);display:block;margin-top:2px;line-height:1.3}
.xb{width:40px;height:50px;border:0;background:none;color:#B33;font-size:24px;cursor:pointer}
.sum{display:flex;justify-content:space-between;border-top:2px solid var(--ink);margin-top:8px;padding-top:8px;font-weight:800;font-size:18px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.presets button{min-height:40px;border:1.5px solid #C9C1B8;background:#fff;border-radius:999px;padding:0 14px;font:inherit;font-size:15px;cursor:pointer}
.presets button.on{background:var(--br);color:#fff;border-color:var(--br)}
.loss{border-top:1px dashed var(--line);padding-top:6px;margin-top:10px}
.loss:first-of-type{border-top:0}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:54px;border:1.5px solid #C9C1B8;background:#fff;border-radius:12px;font:inherit;font-size:16px;cursor:pointer;line-height:1.3}
.seg button.on{background:var(--br);color:#fff;border-color:var(--br);font-weight:700}
/* 목록 */
.it{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.it:first-child{border-top:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:18px}
.it .m span{font-size:14px;color:var(--sub)}
.it .r{text-align:right;white-space:nowrap;font-weight:800;font-size:19px;color:var(--br)}
.pi{border-top:1px solid var(--line);padding:10px 0}
.pi:first-child{border-top:0}
.pi .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pi .top b{font-size:17px}
.pi .kg{font-weight:800;white-space:nowrap;color:var(--br)}
.pi .s{font-size:13.5px;color:var(--sub)}
.pi .ed{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin-top:8px;align-items:end}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2B2622;color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:.95}
.nw{white-space:nowrap}
@media (max-width:620px){
 .res .big{font-size:38px}
 .kp{grid-template-columns:1fr 1fr}
 .row3{grid-template-columns:1fr 1fr}
 .ing thead{display:none}
 .ing tr{display:grid;grid-template-columns:1fr 1fr 44px;gap:4px 6px;border-top:1px solid var(--line);padding:8px 0}
 .ing td{padding:0}
 .ing td.n{grid-column:1/3;width:auto}
 .ing td.x{grid-column:3;grid-row:1}
 .ing td.g,.ing td.p{width:auto}
 .ing td.a{grid-column:1/4;text-align:left;padding-top:0;width:auto}
 .pi .ed{grid-template-columns:1fr 1fr}
}
@media print{
 header,nav,.noprint,.xb,.presets,#toast{display:none!important}
 body{background:#fff;font-size:13px}
 main{padding:0;max-width:none}
 .card,.res{break-inside:avoid;border-color:#bbb;padding:10px;margin-bottom:8px}
 input,select{border:0;padding:0;min-height:0;font-size:13px;background:none}
 .res .big{font-size:30px}
}
</style>
</head>

function refreshMaps(){ING_MAP=new Map(ingAll().map(x=>[x.n,x]));PACK_MAP=new Map(packAll().map(x=>[x.n,x]))}
refreshMaps();
const autoKp=n=>{const x=ING_MAP.get(n);return x&&N(x.g)>0?N(x.p)/N(x.g)*1000:null};
const kpOf=r=>(r.kp!=null&&r.kp!=='')?N(r.kp):autoKp(r.n);
const autoUp=n=>{const x=PACK_MAP.get(n);return x?N(x.p)/(N(x.k)||1):null};
const upOf=p=>(p.up!=null&&p.up!=='')?N(p.up):autoUp(p.n);

/* 계산 */
function calc(r){
 const rows=(r.rows||[]).filter(x=>x.n&&N(x.g)>0);
 let mat=0,dough=0,flour=0;const miss=[];
 rows.forEach(x=>{const g=N(x.g),k=kpOf(x);dough+=g;if(FLOUR.test(x.n))flour+=g;if(k==null)miss.push(x.n);else mat+=g*k/1000});
 const W=N(r.pieceW),box=Math.max(1,N(r.box)||1);
 const ideal=W>0?dough/W:0;
 const usable=dough*(1-N(r.doughLoss)/100);
 const frac=W>0?usable/W:0;
 const pcs=r.scrap==='reuse'?frac:Math.floor(frac+1e-9);
 const good=pcs*(1-N(r.defect)/100);
 const matL=mat*N(r.rawLoss)/100;
 const bat=Math.max(1,N(r.batches)||1);const labor=N(r.people)*N(r.minutes)/60*N(r.wage)/bat;
 const oh=mat*N(r.ohPct)/100;
 let packPc=0;const pmiss=[];
 (r.packs||[]).forEach(p=>{if(!p.n)return;const u=upOf(p),q=N(p.q);if(u==null){pmiss.push(p.n);return}packPc+=p.per==='box'?u*q/box:u*q});
 const logiPc=N(r.logi)/box;
 const d=(a,b)=>b>0?a/b:0;
 const A=d(mat,ideal),B=d(mat+matL,ideal),C1=d(mat+matL,frac),C=d(mat+matL,pcs),D=d(mat+matL,good),E=d(mat+matL+labor,good),F=d(mat+matL+labor+oh,good);
 const total=F+packPc+logiPc;
 return {mat,dough,flour,ideal,usable,frac,pcs,good,matL,labor,oh,packPc,logiPc,A,B,C1,C,D,E,F,total,box,boxCost:total*box,batch:mat+matL+labor+oh,miss,pmiss,W};
}

  <div class="kp">
   <div><span>${boxLbl} 원가</span><b>${won(c.boxCost)}</b></div>
   <div><span>권장 판매가 (원가율 ${num(tgt)}%)</span><b>${won(rec)}</b></div>
   <div><span>지금 판매가 원가율</span><b style="color:${rate==null?'var(--sub)':rate>tgt+5?'var(--red)':rate>tgt?'var(--org)':'var(--grn)'}">${rate==null?'판매가 없음':num(rate,1)+'%'}</b></div>
   <div><span>재료+로스만 (인건비 빼고)</span><b>${won(c.D)}</b></div>
   <div><span>실제 나오는 좋은 제품</span><b>${num(c.good,1)}개</b></div>
   <div><span>1배합 총원가</span><b>${won(c.batch)}</b></div>
  </div>
  ${price>0?`<div class="info">판매가 ${won(price)} − 원가 ${won(c.boxCost)} = ${boxLbl} 남는 돈 <b class="nw">${won(price-c.boxCost)}</b> (1개 ${won((price-c.boxCost)/c.box)})</div>`:''}
  ${warn?`<div class="warn">${warn}</div>`:''}
  ${c.miss.length?`<div class="note">단가가 없는 재료: ${c.miss.map(esc).join(', ')} → 0원으로 계산됨. 1kg 가격을 넣어 주세요.</div>`:''}
  ${c.pmiss.length?`<div class="note">단가가 없는 포장재: ${c.pmiss.map(esc).join(', ')}</div>`:''}`;
 // 폭포
 const steps=[
  ['재료비만 (생산실 계산 방식)',`재료비 ${won(c.mat)} ÷ 반죽 전부 나눈 개수 ${num(c.ideal,2)}개`,c.A,'#8D6E63',true],
  ['원료 손실',`보관·계량·유통기한 폐기 ${num(N(r.rawLoss),1)}%`,c.B-c.A,'#E07B00'],
  ['반죽 손실',`믹서·작업대에 남는 반죽 ${num(N(r.doughLoss),1)}% → ${num(c.frac,2)}개`,c.C1-c.B,'#E07B00'],
  ['자투리 반죽',r.scrap==='reuse'?'다음 반죽에 다시 씀 (추가 없음)':`버림 → ${num(c.pcs)}개로 내림`,c.C-c.C1,'#E07B00'],
  ['불량·폐기',`${num(N(r.defect),1)}% → 좋은 제품 ${num(c.good,1)}개`,c.D-c.C,'#C62828'],
  ['인건비',`${num(N(r.people),1)}명 × ${num(N(r.minutes))}분 × 1시간 ${won(N(r.wage))}${N(r.batches)>1?` ÷ ${num(N(r.batches))}배합`:''} = 1배합 ${won(c.labor)}`,c.E-c.D,'#1E5AA8'],
  ['전기·가스·수도 등',`재료비의 ${num(N(r.ohPct),1)}% = ${won(c.oh)}`,c.F-c.E,'#1E5AA8'],
  ['포장재',(r.packs||[]).filter(p=>p.n).length?`${(r.packs||[]).filter(p=>p.n).length}가지`:'없음',c.packPc,'#6A4C93'],
  ['배송비',N(r.logi)>0?`1봉·1박스 ${won(N(r.logi))} ÷ ${num(c.box)}개`:'없음',c.logiPc,'#6A4C93'],
 ];
 const mx=Math.max(c.total,1);let acc=0;
 $('#wf').innerHTML=`<div class="wf">${steps.map(([t,s,v,col,first])=>{const left=first?0:acc/mx*100,w=Math.max(0,v)/mx*100;acc+=v;
   return `<div class="t">${t}<small>${s}</small></div><div class="v">${first?'':'+'}${num(v,1)}원</div><div class="bk"><i style="left:${left}%;width:${w}%;background:${col}"></i></div>`}).join('')}
  <div class="t tot">= 1개 현실 원가</div><div class="v tot">${num(c.total,1)}원</div></div>`;
}

/* 제품 목록 */
function renderList(){
 const items=S.products.map(p=>{const c=calc(p);return `<div class="it" data-open="${p.id}"><div class="m"><b>${esc(p.name)}</b><span>${num(p.pieceW)}g · 재료만 ${num(c.A)}원 · ${new Date(p.updated||0).toLocaleDateString('ko-KR')} 수정</span></div><div class="r">${num(c.total)}원<br><span style="font-size:13px;color:var(--sub);font-weight:400">1개 현실 원가</span></div></div>`}).join('');
 $('#app').innerHTML=`
 <div class="card"><h2>저장한 제품 (${S.products.length}개)</h2><p class="help">누르면 계산 화면으로 열려요. 고친 내용은 자동 저장돼요.</p>${items}
  <button class="btn" id="lNew" style="width:100%;margin-top:10px">+ 새 제품 만들기</button></div>
 <div class="card"><h2>다른 기기로 옮기기</h2>
  <p class="help">저장 내용은 <b>이 기기(이 브라우저)에만</b> 남아요. 태블릿에서 만든 제품을 PC에서 보려면 파일로 내보낸 뒤 PC에서 가져오기 하세요.</p>
  <div class="bar"><button class="btn g" id="lExp">파일로 내보내기</button><button class="btn g" id="lImp">파일 가져오기</button><input type="file" id="lFile" accept=".json,application/json" style="display:none"></div></div>
 <div class="card"><h2>처음 예시로 되돌리기</h2><p class="help">예시 제품(피자도우, 굴뚝빵)만 다시 넣어요. 내가 만든 제품은 지우지 않아요.</p>
  <button class="btn gr" id="lSample">예시 제품 다시 넣기</button></div>
 <p class="help" style="text-align:center">원가 계산기 ${APP_VER} · ${APP_BUILT}</p>`;
 document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{S.cur=e.dataset.open;setTab('calc')});
 $('#lNew').onclick=()=>{const p=blank();S.products.push(p);S.cur=p.id;setTab('calc')};
 $('#lSample').onclick=()=>{S.products.push(...samples());save();renderList();toast('예시 제품을 넣었어요')};
 $('#lExp').onclick=()=>{const blob=new Blob([JSON.stringify({app:'drawbread_cost',ver:APP_VER,at:new Date().toISOString(),products:S.products,prices:S.prices,packs:S.packs},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);const d=new Date();a.download=`원가계산기_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
 $('#lImp').onclick=()=>$('#lFile').click();
 $('#lFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!=='drawbread_cost'||!Array.isArray(j.products))throw 0;
   let add=0,upd=0;j.products.forEach(p=>{const i=S.products.findIndex(x=>x.id===p.id);if(i<0){S.products.push(p);add++}else if((p.updated||0)>(S.products[i].updated||0)){S.products[i]=p;upd++}});
   Object.assign(S.prices,j.prices||{});Object.assign(S.packs,j.packs||{});refreshMaps();save(true);renderList();toast(`새 제품 ${add}개, 최신으로 바뀐 제품 ${upd}개`)}catch(_){alert('원가 계산기에서 내보낸 파일이 아니에요.')}};
}

/* 단가표 */
let PQ='',PT='ing';
function renderPrice(){
 $('#app').innerHTML=`
 <div class="card"><h2>단가표</h2><p class="help">${esc(PRICE_BASE)} 기준 공급가(부가세 별도)예요. 값이 오르면 여기서 고치면 모든 제품 원가가 같이 바뀌어요. <span class="chip o">확인 필요</span> 표시는 최근 매입 기록이 없거나 추정한 단가예요.</p>
  <div class="seg" style="margin-bottom:10px"><button type="button" data-pt="ing" class="${PT==='ing'?'on':''}">원료</button><button type="button" data-pt="pack" class="${PT==='pack'?'on':''}">포장재</button></div>
  <input id="pq" placeholder="찾기 (예: 버터, 소금)" value="${esc(PQ)}">
  <div id="plist" style="margin-top:6px"></div></div>
 <div class="card"><h2>새로 추가</h2>
  <label class="f">이름</label><input id="nN" placeholder="${PT==='ing'?'예: 엑스트라버진 올리브오일':'예: 피자 박스'}">
  <div class="row2"><div><label class="f">포장 가격 (원)</label><input id="nP" type="number" inputmode="decimal"></div>
  <div><label class="f">${PT==='ing'?'포장 무게 (g)':'포장 안 개수'}</label><input id="nG" type="number" inputmode="decimal" placeholder="${PT==='ing'?'예: 1000':'예: 100'}"></div></div>
  <button class="btn" id="nAdd" style="width:100%;margin-top:12px">추가하기</button></div>`;
 document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PT=b.dataset.pt;renderPrice()});
 $('#pq').oninput=e=>{PQ=e.target.value;drawP()};
 $('#nAdd').onclick=()=>{const n=$('#nN').value.trim(),p=N($('#nP').value),g=N($('#nG').value);if(!n||!(g>0)){alert('이름과 '+(PT==='ing'?'포장 무게':'개수')+'를 넣어 주세요.');return}
  if(PT==='ing')S.prices[n]={p,g,s:'직접 추가 '+new Date().toLocaleDateString('ko-KR')};else S.packs[n]={p,k:g,s:'직접 추가 '+new Date().toLocaleDateString('ko-KR')};
  refreshMaps();save();PQ=n;renderPrice()};
 drawP();
}
function drawP(){
 const isI=PT==='ing',list=(isI?[...ING_MAP.values()]:[...PACK_MAP.values()]).filter(x=>!PQ||x.n.includes(PQ.trim()));
 $('#plist').innerHTML=list.map(x=>{
  const unit=isI?(N(x.g)>0?`1kg ${num(N(x.p)/N(x.g)*1000)}원`:'-'):`1개 ${num(N(x.p)/(N(x.k)||1),1)}원`;
  const pack=isI?`${num(x.g)}g ${won(x.p)}`:`${num(x.k||1)}개 ${won(x.p)}`;
  return `<div class="pi" data-pn="${esc(x.n)}"><div class="top"><div><b>${esc(x.n)}</b> ${x.chk&&!x.edited?'<span class="chip o">확인 필요</span>':''}${x.edited?'<span class="chip g">고침</span>':''}${x.custom?'<span class="chip b">추가</span>':''}
   <div class="s">${pack} · ${esc(x.s||'')}</div></div><div class="kg">${unit}</div></div>
   <div class="ed"><div><label class="f" style="font-size:14px">포장 가격(원)</label><input type="number" inputmode="decimal" data-pe="p" value="${esc(x.p)}"></div>
   <div><label class="f" style="font-size:14px">${isI?'포장 무게(g)':'포장 안 개수'}</label><input type="number" inputmode="decimal" data-pe="${isI?'g':'k'}" value="${esc(isI?x.g:(x.k||1))}"></div>
   <button class="btn sm" data-psave>저장</button>${x.edited||x.custom?`<button class="btn gr sm" data-preset>${x.custom?'삭제':'원래대로'}</button>`:'<span></span>'}</div></div>`}).join('')||'<p class="help">찾는 품목이 없어요. 아래에서 새로 추가하세요.</p>';
 $('#plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const pi=b.closest('[data-pn]'),n=pi.dataset.pn,store=isI?S.prices:S.packs;
  if(b.hasAttribute('data-psave')){const p=N(pi.querySelector('[data-pe=p]').value),q=N(pi.querySelector(`[data-pe=${isI?'g':'k'}]`).value);if(!(q>0)){alert('무게(개수)를 넣어 주세요.');return}
   const o=store[n]||{};o.p=p;if(isI)o.g=q;else o.k=q;o.s=(o.custom||!(isI?ING0:PACK0).some(z=>z.n===n)?'직접 추가':'고친 날')+' '+new Date().toLocaleDateString('ko-KR');store[n]=o;refreshMaps();save();drawP()}
  else if(b.hasAttribute('data-preset')){delete store[n];refreshMaps();save();drawP()}};
}
render();
</script>
</body>
</html>
