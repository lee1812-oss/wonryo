<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>원가 계산기 · 빵을그리다</title>
<link rel="manifest" href="cost.webmanifest">
<link rel="icon" href="cost_192.png">
<link rel="apple-touch-icon" href="cost_apple.png">
<meta name="theme-color" content="#0D1C42">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--br:#0D1C42;--br2:#22396F;--brl:#EEF2F8;--nv:#0D1C42;--nv2:#22396F;--bg:#F4F5F7;--th:#F1F3F7;--ink:#0B1220;--sub:#2F3846;--line:#D5DAE2;--line2:#A9B3C1;--red:#C62828;--redl:#FDEDED;--org:#B35A00;--orgl:#FFF4E5;--grn:#2E7D32;--grnl:#E8F5E9;--blu:#1E5AA8;--blul:#EAF1FB}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.7 "Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",-apple-system,sans-serif;letter-spacing:-.2px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;line-break:strict}
.in{max-width:1000px;margin:0 auto}
/* 맨 위 줄: 버전·업데이트 시각 */
.util{background:var(--nv);color:#DCE3EF;font-size:16px}
.util .in{padding:7px 16px;display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;align-items:center}
.util .ver{font-weight:700;color:#fff;white-space:nowrap}
.util .ver b{display:inline-block;border:1px solid rgba(255,255,255,.7);border-radius:3px;padding:0 7px;margin-right:7px;font-size:15.5px}
/* 제목 */
.hdr{background:#fff;border-bottom:1px solid var(--line)}
.hdr .in{padding:16px 16px 14px;display:flex;align-items:center;gap:14px}
.hdr img{width:52px;height:52px;border-radius:8px;flex:none;border:1px solid var(--line)}
.hdr h1{margin:0;font-size:27px;font-weight:800;color:var(--nv);letter-spacing:-.6px;line-height:1.25}
.hdr .s{font-size:17px;color:var(--sub)}
/* 남색 머리띠 메뉴 */
nav{background:var(--nv2);position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(13,28,66,.25)}
nav .in{display:flex}
nav button{flex:1;min-height:58px;border:0;border-bottom:4px solid transparent;border-top:4px solid transparent;background:none;color:#fff;font:inherit;font-size:19px;font-weight:700;cursor:pointer}
nav button+button{border-left:1px solid rgba(255,255,255,.18)}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--nv);border-bottom-color:#fff}
main{max-width:1000px;margin:0 auto;padding:0 16px 30px}
/* 쪽 제목 */
.ph{padding:22px 0 14px;border-bottom:2px solid var(--nv);margin-bottom:18px}
.crumb{font-size:16px;color:var(--sub)}
.ph h2{margin:2px 0 2px;font-size:31px;font-weight:800;color:var(--nv);letter-spacing:-.6px;line-height:1.3}
.ph p{margin:0;color:var(--sub);font-size:17.5px;text-wrap:pretty}
/* 상자 */
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--nv2);border-radius:4px;padding:18px 20px;margin-bottom:16px}
.card h2{font-size:22px;margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;color:var(--nv);letter-spacing:-.3px}
.card h2 .no{display:inline-flex;width:30px;height:30px;border-radius:3px;background:var(--nv);color:#fff;font-size:17px;align-items:center;justify-content:center;flex:none}
.srch{background:var(--th);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:16px}
.help{color:var(--sub);line-height:1.7;font-size:17px;margin:0 0 12px;text-wrap:pretty}
label.f{display:block;margin:12px 0 5px;font-weight:700;font-size:17.5px;color:var(--ink)}
label.f small{font-weight:500;color:var(--sub);font-size:16px}
input,select,textarea{font:inherit;font-weight:600;letter-spacing:0;font-size:19px;color:var(--ink);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;min-height:52px;width:100%;background:#fff}
input:focus,select:focus,textarea:focus{outline:3px solid #BFD0EE;border-color:var(--nv2)}
input.miss{border-color:var(--org);background:var(--orgl)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
.btn{min-height:54px;border:1px solid var(--nv2);border-radius:4px;padding:0 20px;font:inherit;font-size:18px;font-weight:700;cursor:pointer;background:var(--nv2);color:#fff}
.btn:hover{background:var(--nv);border-color:var(--nv)}
.btn.g{background:#fff;color:var(--nv2);border-color:var(--nv2)}
.btn.g:hover{background:var(--brl)}
.btn.gr{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.gr:hover{background:var(--th)}
.btn.sm{min-height:54px;font-size:17.5px;padding:0 16px}
.btn.del{background:#fff;color:var(--red);border-color:#E3A9A9}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar>select{flex:1;min-width:220px}
.chip{display:inline-block;font-size:15.5px;font-weight:700;border-radius:3px;padding:1px 8px;vertical-align:middle;border:1px solid}
.chip.o{background:var(--orgl);color:var(--org);border-color:#F0C48C}
.chip.g{background:var(--grnl);color:var(--grn);border-color:#A9D3AB}
.chip.b{background:var(--blul);color:var(--blu);border-color:#AFC6E9}
.chip.r{background:var(--redl);color:var(--red);border-color:#E9AFAF}
/* 결과 */
.res{background:#fff;border:1px solid var(--line);border-top:4px solid var(--nv);border-radius:4px;padding:20px;margin-bottom:16px}
.res .lbl{font-size:18px;color:var(--sub);font-weight:700}
.res .big{font-size:50px;font-weight:800;color:var(--nv);line-height:1.15;letter-spacing:-1px}
.res .big small{font-size:24px;margin-left:2px}
.res .cmp{font-size:18px;margin-top:4px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:2px solid var(--nv);border-left:1px solid var(--line)}
.kp div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.kp span{background:var(--th);line-height:1.4;font-size:16px;color:var(--sub);font-weight:700;padding:8px 12px;border-bottom:1px solid var(--line);flex:1}
.kp b{display:block;font-weight:800;font-size:22px;padding:9px 12px;white-space:nowrap}
.warn,.note,.info{border-radius:4px;padding:12px 14px;margin-top:12px;font-size:17px;border:1px solid;border-left-width:5px}
.warn::before,.note::before,.info::before{display:inline-block;font-size:15px;font-weight:800;color:#fff;border-radius:3px;padding:0 8px;margin-right:8px;vertical-align:1px}
.warn{background:var(--redl);color:#8E1B1B;border-color:#E6A5A5;border-left-color:var(--red);font-weight:700}
.warn::before{content:"주의";background:var(--red)}
.note{background:var(--orgl);color:#7A3D00;border-color:#F0C48C;border-left-color:var(--org)}
.note::before{content:"확인 필요";background:var(--org)}
.info{background:var(--blul);color:#163A6B;border-color:#B7CBEA;border-left-color:var(--blu)}
.info::before{content:"참고";background:var(--blu)}
/* 원가가 늘어나는 이유 */
.wf{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.wf .t{font-size:18px;font-weight:700}
.wf .t small{display:block;color:var(--sub);font-size:16px;line-height:1.45;font-weight:500;margin-top:1px}
.wf .v{font-weight:800;white-space:nowrap;text-align:right;font-size:19px}
.wf .bk{grid-column:1/3;height:10px;background:#E8ECF2;border-radius:2px;overflow:hidden;margin-bottom:10px;position:relative}
.wf .bk i{position:absolute;top:0;bottom:0;border-radius:2px}
.wf .tot{border-top:2px solid var(--nv);padding-top:10px;font-weight:800;font-size:20px;color:var(--nv)}
/* 배합 표 */
.ing{width:100%;border-collapse:collapse;border-top:2px solid var(--nv)}
.ing th{background:var(--th);font-size:16.5px;color:var(--ink);text-align:left;font-weight:700;padding:10px 6px;border-bottom:1px solid var(--line2)}
.ing td{padding:7px 6px;vertical-align:top;border-bottom:1px solid var(--line)}
.ing td.n{width:38%}
.ing td.g{width:17%}
.ing td.p{width:21%}
.ing td.a{width:16%;text-align:right;font-weight:700;padding-top:20px;white-space:nowrap}
.ing td.x{width:46px}
.ing .bp{font-size:15.5px;color:var(--sub);display:block;text-align:right;margin-top:2px}
.ing .ps{font-weight:500;font-size:15.5px;color:var(--sub);display:block;margin-top:3px;line-height:1.35}
.xb{width:44px;height:52px;border:0;background:none;color:#B33;font-size:26px;cursor:pointer}
.sum{display:flex;justify-content:space-between;background:var(--th);border-top:2px solid var(--nv);border-bottom:1px solid var(--line2);margin-top:10px;padding:10px 12px;font-weight:800;font-size:19.5px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.presets button{min-height:54px;min-width:64px;border:1px solid var(--line2);background:#fff;border-radius:4px;padding:0 14px;font:inherit;font-size:17.5px;font-weight:700;color:var(--ink);cursor:pointer}
.presets button.on{background:var(--nv2);color:#fff;border-color:var(--nv2)}
.loss{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
.loss:first-of-type{border-top:0}
.seg{display:flex;gap:0}
.seg button{flex:1;min-height:56px;border:1px solid var(--line2);background:#fff;font:inherit;font-size:17.5px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1.3;padding:6px 8px}
.seg button+button{border-left:0}
.seg button:first-child{border-radius:4px 0 0 4px}
.seg button:last-child{border-radius:0 4px 4px 0}
.seg button small{font-weight:500;font-size:15.5px}
.seg button.on{background:var(--nv2);color:#fff;border-color:var(--nv2)}
/* 목록 */
.lh{display:flex;justify-content:space-between;background:var(--th);border-top:2px solid var(--nv);border-bottom:1px solid var(--line2);padding:9px 12px;font-weight:700;font-size:16.5px}
.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:12px;cursor:pointer}
.it:hover{background:#F7F9FC}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:19px;color:var(--nv)}
.it .m span{font-size:16px;color:var(--sub)}
.it .r{text-align:right;white-space:nowrap;font-weight:800;font-size:21px;color:var(--nv)}
.pi{border-bottom:1px solid var(--line);padding:12px 4px}
.pi .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pi .top b{font-size:18.5px}
.pi .kg{font-weight:800;white-space:nowrap;color:var(--nv)}
.pi .s{font-size:16px;color:var(--sub)}
.pi .ed{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin-top:8px;align-items:end}
#plist{border-top:2px solid var(--nv)}
.lk{border:0;background:none;color:var(--blu);font:inherit;font-size:16px;font-weight:700;text-decoration:underline;padding:4px 0;cursor:pointer}
#olBg{position:fixed;inset:0;background:rgba(13,28,66,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px}
.olBox{background:#fff;border-radius:6px;border-top:5px solid var(--nv);padding:20px;max-width:660px;width:100%;margin:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--nv);color:#fff;padding:12px 20px;border-radius:4px;font-size:17px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:.96}
footer{background:#E9ECF1;border-top:1px solid var(--line);color:#2F3744;font-size:16.5px}
footer .in{padding:18px 16px 28px;line-height:1.75}
footer b{color:var(--nv)}
.nw{white-space:nowrap}
/* 휴대폰 화면 */
body.v-m .util{font-size:15.5px}
body.v-m .hdr .in{padding:12px 14px}
body.v-m .hdr img{width:44px;height:44px}
body.v-m .hdr h1{font-size:23px}
body.v-m .hdr .s{font-size:16px}
body.v-m nav button{font-size:18px;min-height:56px}
body.v-m main{padding:0 12px 24px}
body.v-m .ph{padding:16px 0 12px;margin-bottom:14px}
body.v-m .ph h2{font-size:24px}
body.v-m .card{padding:16px 14px}
body.v-m .res{padding:16px 14px}
body.v-m .res .big{font-size:42px}
body.v-m .kp{grid-template-columns:1fr 1fr}
body.v-m .kp b{font-size:21px}
body.v-m .row3{grid-template-columns:1fr 1fr}
body.v-m .ing thead{display:none}
body.v-m .ing tr{display:grid;grid-template-columns:1fr 1fr 46px;gap:4px 8px;border-bottom:1px solid var(--line);padding:10px 0}
body.v-m .ing td{padding:0;border:0}
body.v-m .ing td.n{grid-column:1/3;width:auto}
body.v-m .ing td.x{grid-column:3;grid-row:1}
body.v-m .ing td.g,body.v-m .ing td.p{width:auto}
body.v-m .ing td.a{grid-column:1/4;text-align:left;padding-top:0;width:auto;font-size:19px}
body.v-m .ing td.g::before,body.v-m .ing td.p::before{display:block;font-size:15.5px;font-weight:700;color:var(--sub);margin-bottom:3px}
body.v-m .ing td.g::before{content:"사용량 (g)"}
body.v-m .ing td.p::before{content:"1kg 가격 (원)"}
body.v-m .ing td.a:not(:empty)::before{content:"금액  ";font-size:16px;color:var(--sub)}
body.v-m .pi .ed{grid-template-columns:1fr 1fr}
body.v-m .seg button{font-size:17px}
/* 공통 추가 (v005) */
.hdr .in{flex-wrap:wrap}
textarea{line-height:1.6;resize:vertical}
#mbar{display:none}
.vsw{display:flex;align-items:center;margin-left:auto}
.vsw>span{font-size:16px;font-weight:700;color:var(--sub);margin-right:8px}
.vsw button{min-height:54px;padding:0 16px;border:1px solid var(--line2);background:#fff;font:inherit;font-size:16.5px;font-weight:700;color:var(--ink);cursor:pointer}
.vsw button+button{border-left:0}
.vsw button:first-of-type{border-radius:4px 0 0 4px}
.vsw button:last-of-type{border-radius:0 4px 4px 0}
.vsw button.on{background:var(--nv2);color:#fff;border-color:var(--nv2)}
body.v-m .hdr .vsw,body.v-pc footer .vsw{display:none}
.pin{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pin>input{width:120px;flex:none}
.pin .presets{margin-top:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.gInfo{display:grid;grid-template-columns:repeat(4,1fr);gap:0 14px}
.gInfo .sp2{grid-column:span 2}
.g2 .loss{border-top:0;margin-top:0}
.calcGrid{display:grid;grid-template-columns:minmax(0,1fr) 470px;gap:20px;align-items:start}
.colL{grid-column:1;grid-row:1;min-width:0}
.colR{grid-column:2;grid-row:1;position:sticky;top:74px;max-height:calc(100vh - 86px);overflow:auto;padding-bottom:4px}
.colR .kp{grid-template-columns:1fr 1fr}
.listGrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.listGrid>div{min-width:0}
.boxNav{background:#fff;border:1px solid var(--line);border-top:3px solid var(--nv2);border-radius:4px;padding:10px;position:sticky;top:74px}
.bxn{display:flex;width:100%;align-items:center;gap:8px;min-height:54px;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.bxn:hover{background:#F7F9FC}
.bxn span{flex:1;min-width:0}
.bxn b{display:block;font-size:17.5px}
.bxn small{display:block;font-size:15.5px;color:var(--sub);font-weight:500;line-height:1.4}
.bxn em{font-style:normal;font-weight:800;color:var(--nv2);background:var(--brl);border-radius:3px;padding:0 9px}
.bxn.on{background:var(--nv2);color:#fff}
.bxn.on small{color:#DCE3EF}
.bxn.on em{background:#fff}
.bxh{font-size:15.5px;font-weight:800;color:var(--sub);padding:14px 10px 6px;border-bottom:2px solid var(--nv)}
.kv{width:100%;border-collapse:collapse;border-top:2px solid var(--nv)}
.kv th{background:var(--th);text-align:left;font-size:16.5px;padding:10px 12px;border-bottom:1px solid var(--line);width:120px;white-space:nowrap;vertical-align:top}
.kv td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.kv td.pre{white-space:pre-wrap}
.fl small{color:var(--sub);font-size:15.5px}
.pt{width:100%;border-collapse:collapse;border-top:2px solid var(--nv)}
.pt th{background:var(--th);font-size:16px;text-align:left;padding:10px;border-bottom:1px solid var(--line2);white-space:nowrap}
.pt td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.pt .r{text-align:right;white-space:nowrap}
.pt td.big{font-weight:800;font-size:19px;color:var(--nv)}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover{background:#F7F9FC}
.pt td b{color:var(--nv);font-size:18px}
.bxt{display:block;font-size:15.5px;color:var(--blu);font-weight:600}
.priceGrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.priceGrid>.card{min-width:0}
.priceGrid>.card:last-child{position:sticky;top:74px}
.plh{display:none}
body.v-pc .plh{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 110px 74px 96px;gap:10px;background:var(--th);padding:9px 4px;font-weight:700;font-size:16px;border-bottom:1px solid var(--line2)}
body.v-pc .pi{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px 110px 74px 96px;gap:10px;align-items:center}
body.v-pc .pi .top,body.v-pc .pi .ed{display:contents}
body.v-pc .pi .ed label{display:none}
body.v-pc .pi .kg{text-align:right}
body.v-pc .in,body.v-pc main{max-width:1440px}
/* 휴대폰 화면: 접는 칸 */
.shh{padding:0!important;border:0!important;margin:0!important}
.sh{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;background:none;border:0;padding:0;font:inherit;font-size:22px;font-weight:800;color:var(--nv);text-align:left;cursor:pointer;letter-spacing:-.3px}
.sh .tt{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tgl{flex:none;font-size:16px;font-weight:700;color:var(--nv2);border:1px solid var(--nv2);border-radius:4px;padding:6px 12px}
.ssum{display:none}
.sec.shut .sbody{display:none}
.sec.shut .ssum{display:block;color:var(--sub);font-size:16.5px;margin-top:2px}
.sec:not(.shut) .shh{border-bottom:1px solid var(--line)!important;margin-bottom:12px!important;padding-bottom:6px!important}
body.v-m .in,body.v-m main{max-width:640px}
body.v-m .calcGrid{display:block}
body.v-m .colR{position:static;max-height:none;overflow:visible}
body.v-m .colR .kp{grid-template-columns:1fr 1fr}
body.v-m .listGrid,body.v-m .priceGrid,body.v-m .g2{display:block}
body.v-m .boxNav,body.v-m .priceGrid>.card:last-child{position:static}
body.v-m .boxNav{margin-bottom:16px}
body.v-m .g2 .loss{border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
body.v-m .g2 .loss:first-child{border-top:0;margin-top:0}
body.v-m .g4,body.v-m .gInfo{grid-template-columns:1fr 1fr}
body.v-m .pt .hm{display:none}
body.v-m.t-calc #mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--nv);color:#fff;padding:8px 14px calc(8px + env(safe-area-inset-bottom));gap:12px;align-items:center;box-shadow:0 -2px 8px rgba(0,0,0,.2)}
#mbar div{flex:1;min-width:0}
#mbar span{display:block;font-size:15px;color:#DCE3EF;font-weight:600}
#mbar b{display:block;font-size:22px;font-weight:800;white-space:nowrap;line-height:1.25}
#mbar .btn{background:#fff;color:var(--nv);border-color:#fff}
body.v-m.t-calc main{padding-bottom:30px}

<script>
const APP_VER='v005', APP_BUILT='2026-11-11 10:55';
const LSK='drawbread_cost_key', LSP='drawbread_cost_prices';
let PD=null, PSTAT='loading';
try{const c=JSON.parse(localStorage.getItem(LSP)||'null');if(c&&c.data)PD=c.data}catch(e){}
(function(){const m=location.hash.match(/[#&]k=([A-Za-z0-9_-]{10,})/);if(m){try{localStorage.setItem(LSK,m[1])}catch(e){}history.replaceState(null,'',location.pathname+location.search)}})();
const priceBase=()=>PD?`이카운트 최근 매입가 (${PD.snap} 06:30 자료)`:'단가표 없음';
const LS='drawbread_cost_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=v=>(isFinite(v)?Math.round(v):0).toLocaleString('ko-KR')+'원';
const num=(v,d=0)=>(isFinite(v)?(+v).toLocaleString('ko-KR',{maximumFractionDigits:d,minimumFractionDigits:0}):'0');
const N=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:0};
const FLOUR=/밀가루|강력|박력|중력|블레소레이유|T65|쌀가루|현미가루|통밀|호밀/;

function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function blank(){return {id:uid(),name:'새 제품',pieceW:100,box:1,price:'',target:35,rawLoss:1,doughLoss:2,scrap:'drop',defect:3,people:1,minutes:60,batches:1,wage:13000,ohPct:5,logi:0,rows:[{n:'',g:''},{n:'',g:''},{n:'',g:''}],packs:[],memo:'',updated:Date.now()}}
function samples(){
 const a=blank();Object.assign(a,{name:'피자도우 260g',pieceW:260,box:1,minutes:40,
  rows:[{n:'코끼리강력밀가루(면세)',g:4000},{n:'꽃소금',g:80},{n:'물',g:2640},{n:'고당 드라이이스트(효모)',g:15},{n:'올리브유-포마스',g:50},{n:'잡화벌꿀',g:20}],
  memo:'생산실 원가표(10/29) 배합. 인건비 1명 40분은 예시 값'});
 const b=blank();Object.assign(b,{name:'굴뚝빵 생지 115g',pieceW:115,box:30,price:39000,
  rows:[{n:'K-블레소레이유',g:1200},{n:'프랑스밀가루T65',g:220},{n:'게랑드 소금',g:30},{n:'고당 드라이이스트(효모)',g:20},{n:'하얀설탕(큐원)',g:100},{n:'코코넛슈가',g:30},{n:'S-500개량제',g:38},{n:'계란 대란 (껍질 뺀 50g/개)',g:200},{n:'맑은식용유(큐원)',g:60},{n:'이즈니 고메버터',g:420},{n:'우유',g:800}],
  memo:'10/26 원가보고 배합. 판매가는 이카운트 DBS31 30개 39,000원. 인건비 1명 60분은 예시 값'});
 return [a,b];
}
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&Array.isArray(s.products)&&s.products.length){s.prices=s.prices||{};s.packs=s.packs||{};s.boxes=s.boxes||[];return s}}catch(e){}
 const p=samples();return {products:p,prices:{},packs:{},boxes:[],cur:p[0].id,tab:'calc'}}
let S=load();
/* 화면 종류: PC / 휴대폰 / 자동 (v005) */
const LSV='drawbread_cost_view';
let VPREF='auto';try{VPREF=localStorage.getItem(LSV)||'auto'}catch(e){}
(function(){const m=location.search.match(/[?&]view=(pc|m|auto)\b/);if(m){VPREF=m[1];try{localStorage.setItem(LSV,VPREF)}catch(e){}}})();
let VIEW='pc';
const calcView=()=>VPREF==='pc'||VPREF==='m'?VPREF:(window.innerWidth>=1000?'pc':'m');
function applyView(){VIEW=calcView();const b=document.body.classList;b.toggle('v-pc',VIEW==='pc');b.toggle('v-m',VIEW==='m');b.toggle('t-calc',(S.tab||'calc')==='calc')}
function setView(v){VPREF=v;try{localStorage.setItem(LSV,v)}catch(e){}render();toast(v==='pc'?'PC 화면으로 바꿨어요':v==='m'?'휴대폰 화면으로 바꿨어요':'화면 크기에 맞게 자동으로 바꿔요')}
let rzT=null;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(VPREF==='auto'&&calcView()!==VIEW)render()},250)});
const OPEN=new Set(['ing']);
function secCard(id,no,title,chip,body){
 const m=VIEW==='m',shut=m&&!OPEN.has(id);
 const head=`${no?`<span class="no">${no}</span>`:''}<span class="tt">${title}${chip||''}</span>`;
 return `<div class="card sec${shut?' shut':''}" data-secid="${id}">${m?`<h2 class="shh"><button type="button" class="sh" data-sec="${id}">${head}<span class="tgl">${shut?'펼치기':'접기'}</span></button></h2><div class="ssum" id="sum_${id}"></div>`:`<h2>${head}</h2>`}<div class="sbody">${body}</div></div>`;
}
function toggleSec(id){if(OPEN.has(id))OPEN.delete(id);else OPEN.add(id);const c=document.querySelector(`[data-secid="${id}"]`);if(!c)return;const sh=!OPEN.has(id);c.classList.toggle('shut',sh);const t=c.querySelector('.tgl');if(t)t.textContent=sh?'펼치기':'접기'}
function afterUpdate(r,c){
 const set=(id,t)=>{const e=document.getElementById('sum_'+id);if(e)e.textContent=t};
 const nRows=(r.rows||[]).filter(x=>x.n&&N(x.g)>0).length,pk=(r.packs||[]).filter(p=>p.n).length;
 set('info',`${num(N(r.pieceW))}g · ${num(c.box)}개 · 판매가 ${N(r.price)>0?won(N(r.price)):'없음'} · 목표 원가율 ${num(N(r.target))}%`);
 set('ing',`재료 ${nRows}가지 · 반죽 ${num(c.dough)}g · 재료비 ${won(c.mat)}`);
 set('loss',`원료 ${num(N(r.rawLoss),1)}% · 반죽 ${num(N(r.doughLoss),1)}% · 자투리 ${r.scrap==='reuse'?'다시 씀':'버림'} · 불량 ${num(N(r.defect),1)}%`);
 set('labor',`${num(N(r.people),1)}명 × ${num(N(r.minutes))}분 · 1시간 ${won(N(r.wage))} · 간접비 ${num(N(r.ohPct),1)}%`);
 set('pack',`포장재 ${pk?pk+'가지':'없음'} · 배송비 ${N(r.logi)>0?won(N(r.logi)):'없음'}`);
 set('memo',(r.memo||'').replace(/\s+/g,' ').slice(0,60)||'메모 없음');
 set('wf',`재료만 ${num(c.A,1)}원 → 현실 원가 ${num(c.total,1)}원`);
 const mb=$('#mbar');if(!mb)return;
 const price=N(r.price),tgt=N(r.target)||35,rate=price>0?c.boxCost/price*100:null;
 mb.innerHTML=`<div><span>1개 현실 원가</span><b>${won(c.total)}</b></div><div><span>${rate!=null?'판매가 원가율':`권장 판매가 (${num(tgt)}%)`}</span><b>${rate!=null?num(rate,1)+'%':won(c.boxCost/(tgt/100))}</b></div><button type="button" class="btn sm" id="mTop">결과 보기</button>`;
 $('#mTop').onclick=()=>{const e=$('#res');if(e)window.scrollTo({top:e.getBoundingClientRect().top+scrollY-74,behavior:'smooth'})};
}
/* 보관함 (v005) */
const boxOf=p=>p&&p.bxId?(S.boxes||[]).find(b=>b.id===p.bxId)||null:null;
const fmtD=d=>d?String(d).slice(0,10).replace(/-/g,'.'):'';
const todayStr=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function grpOpts(opt){
 const none=S.products.filter(p=>!boxOf(p));
 let h=none.length?`<optgroup label="일반 제품">${none.map(opt).join('')}</optgroup>`:'';
 (S.boxes||[]).forEach(b=>{const l=S.products.filter(p=>p.bxId===b.id);if(l.length)h+=`<optgroup label="보관함 · ${esc(b.name)}">${l.map(opt).join('')}</optgroup>`});
 return h;
}
const FDB={db:null,
 open(){return this.db||(this.db=new Promise((ok,no)=>{const q=indexedDB.open('drawbread_cost_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}))},
 async put(id,v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})},
 async get(id){const d=await this.open();return new Promise((ok,no)=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})},
 async del(id){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('f','readwrite');t.objectStore('f').delete(id);t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})}};
const blobToUrl=b=>new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.readAsDataURL(b)});
const urlToBlob=async u=>(await fetch(u)).blob();
let saveT=null;
function save(quiet){S.tab=S.tab||'calc';try{localStorage.setItem(LS,JSON.stringify(S));if(!quiet)toast('자동 저장됨')}catch(e){toast('저장 실패: 기기 저장 공간을 확인해 주세요')}}
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(()=>save(true),500)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600)}
function cur(){let p=S.products.find(x=>x.id===S.cur);if(!p){p=S.products[0];S.cur=p.id}return p}

/* 단가: 이카운트 최근 매입가(암호 파일) + 이 기기에서 고친 값·온라인 조회 값 */
function mergeP(base,store){
 const m=new Map();
 base.forEach(x=>m.set(x.n,{...x,base:1}));
 Object.entries(store).forEach(([n,o])=>{if(o.del){m.delete(n);return}const b=m.get(n);
  if(b&&b.src==='buy'&&b.d&&o.at&&b.d>String(o.at).slice(0,10)){b.staleOv=o;return}
  m.set(n,{...(b||{n,s:'직접 추가'}),...o,n,edited:!!b,custom:!b,ecount:b&&b.src==='buy'?b:null})});
 return [...m.values()];
}
const ingAll=()=>mergeP((PD&&PD.ing)||[{n:'물',p:0,g:1000,src:'fix',s:'0원'}],S.prices);
const packAll=()=>mergeP((PD&&PD.pack)||[],S.packs);
let ING_MAP,PACK_MAP,CODE_MAP;
function refreshMaps(){ING_MAP=new Map(ingAll().map(x=>[x.n,x]));PACK_MAP=new Map(packAll().map(x=>[x.n,x]));
 CODE_MAP=new Map();((PD&&PD.ing)||[]).forEach(x=>{if(x.c)CODE_MAP.set(x.c,x.n)});((PD&&PD.pack)||[]).forEach(x=>{if(x.c)CODE_MAP.set('P:'+x.c,x.n)});
 migrate()}
function migrate(){(S.products||[]).forEach(p=>{(p.rows||[]).forEach(x=>{if(x.c&&CODE_MAP.has(x.c))x.n=CODE_MAP.get(x.c);else if(x.n){const it=ING_MAP.get(x.n);if(it&&it.c)x.c=it.c}});
 (p.packs||[]).forEach(x=>{if(x.c&&CODE_MAP.has('P:'+x.c))x.n=CODE_MAP.get('P:'+x.c);else if(x.n){const it=PACK_MAP.get(x.n);if(it&&it.c)x.c=it.c}})})}
async function decryptP(j,pw){
 const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(j.salt),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(j.iv)},key,ub(j.ct))));
}
async function loadPrices(force){
 let key=null;try{key=localStorage.getItem(LSK)}catch(e){}
 if(!key){PSTAT='nokey';return false}
 try{
  const j=await (await fetch('cost_prices.enc.json?t='+Date.now(),{cache:'no-store'})).json();
  let c=null;try{c=JSON.parse(localStorage.getItem(LSP)||'null')}catch(e){}
  if(!force&&c&&c.updated===j.updated&&c.data){PD=c.data;PSTAT='ok';return false}
  const data=await decryptP(j,key);PD=data;try{localStorage.setItem(LSP,JSON.stringify({updated:j.updated,data}))}catch(e){}
  PSTAT='ok';return true;
 }catch(e){PSTAT=(e&&e.name==='OperationError')?'badkey':(PD?'offline':'fail');return false}
}
function priceBanner(){
 if(PSTAT==='ok'||PSTAT==='loading')return '';
 const t={nokey:'단가표가 잠겨 있어요. 조조가 드린 「원가계산기 열쇠 링크」(QR)로 이 기기에서 한 번 열어 주세요. 그 전에는 가격을 직접 넣어 계산할 수 있어요.',
  badkey:'열쇠가 맞지 않아 단가표를 열지 못했어요. 열쇠 링크로 다시 열어 주세요.',
  offline:'인터넷이 안 돼서 이 기기에 저장된 지난 단가표를 쓰고 있어요.',fail:'단가표를 받지 못했어요. 인터넷 연결을 확인해 주세요.'}[PSTAT]||'';
 return `<div class="note noprint" style="margin:0 0 14px">${t}</div>`;
}
refreshMaps();
const autoKp=n=>{const x=ING_MAP.get(n);return x&&N(x.g)>0?N(x.p)/N(x.g)*1000:null};
const kpOf=r=>(r.kp!=null&&r.kp!=='')?N(r.kp):autoKp(r.n);
const autoUp=n=>{const x=PACK_MAP.get(n);return x?N(x.p)/(N(x.k)||1):null};
const upOf=p=>(p.up!=null&&p.up!=='')?N(p.up):autoUp(p.n);

/* 계산 */
function calc(r){
 const rows=(r.rows||[]).filter(x=>x.n&&N(x.g)>0);
 let mat=0,dough=0,flour=0;const miss=[];
 rows.forEach(x=>{const g=N(x.g),k=kpOf(x);dough+=g;if(FLOUR.test(x.n))flour+=g;if(k==null)miss.push(x.n);else mat+=g*k/1000});
 const W=N(r.pieceW),box=Math.max(1,N(r.box)||1);
 const ideal=W>0?dough/W:0;
 const usable=dough*(1-N(r.doughLoss)/100);
 const frac=W>0?usable/W:0;
 const pcs=r.scrap==='reuse'?frac:Math.floor(frac+1e-9);
 const good=pcs*(1-N(r.defect)/100);
 const matL=mat*N(r.rawLoss)/100;
 const bat=Math.max(1,N(r.batches)||1);const labor=N(r.people)*N(r.minutes)/60*N(r.wage)/bat;
 const oh=mat*N(r.ohPct)/100;
 let packPc=0;const pmiss=[];
 (r.packs||[]).forEach(p=>{if(!p.n)return;const u=upOf(p),q=N(p.q);if(u==null){pmiss.push(p.n);return}packPc+=p.per==='box'?u*q/box:u*q});
 const logiPc=N(r.logi)/box;
 const d=(a,b)=>b>0?a/b:0;
 const A=d(mat,ideal),B=d(mat+matL,ideal),C1=d(mat+matL,frac),C=d(mat+matL,pcs),D=d(mat+matL,good),E=d(mat+matL+labor,good),F=d(mat+matL+labor+oh,good);
 const total=F+packPc+logiPc;
 return {mat,dough,flour,ideal,usable,frac,pcs,good,matL,labor,oh,packPc,logiPc,A,B,C1,C,D,E,F,total,box,boxCost:total*box,batch:mat+matL+labor+oh,miss,pmiss,W};
}

/* 화면 */
function setTab(t){S.tab=t;save(true);render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function pageHead(t,d){return `<div class="ph"><div class="crumb">홈 › 원가 계산기 › ${t}</div><h2>${t}</h2><p>${d}</p></div>`}
function verText(){const [d,t]=APP_BUILT.split(' ');return `<b>${APP_VER}</b>${d.replace(/-/g,'.')} ${t||''} 업데이트`}
function vswHtml(){return `<span>화면</span>${[['pc','PC'],['m','휴대폰'],['auto','자동']].map(([v,l])=>`<button type="button" data-view="${v}" class="${VPREF===v?'on':''}">${l}</button>`).join('')}`}
function renderFoot(){$('#verTop').innerHTML=verText();$('#vsw').innerHTML=vswHtml();$('#foot').innerHTML=`<div class="vsw noprint" style="margin:0 0 12px">${vswHtml()}</div><b>빵을그리다 원가 계산기</b> · 프로그램 ${APP_VER} (${esc(APP_BUILT)} 업데이트) · 지금 ${VIEW==='pc'?'PC':'휴대폰'} 화면<br>PC 화면 주소: cost.html?view=pc · 휴대폰 화면 주소: cost.html?view=m<br>단가 자료 기준: ${esc(priceBase())}<br>모든 금액은 부가세 별도예요. 입력한 내용은 이 기기(브라우저)에 자동 저장돼요.`;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view))}
function render(){
 applyView();renderFoot();
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
 if(S.tab==='list')renderList();else if(S.tab==='price')renderPrice();else renderCalc();
 window.scrollTo(0,0);
}

function numIn(k,v,ph,step){return `<input type="number" inputmode="decimal" step="${step||'any'}" data-k="${k}" value="${esc(v)}" placeholder="${esc(ph||'')}">`}
function presets(k,vals,v,unit){return `<div class="presets">${vals.map(x=>`<button type="button" data-pre="${k}" data-v="${x}" class="${N(v)===x?'on':''}">${x}${unit}</button>`).join('')}</div>`}

function renderCalc(){
 const r=cur(),bx=boxOf(r);
 const opt=p=>`<option value="${p.id}" ${p.id===r.id?'selected':''}>${esc(p.name)}</option>`;
 const boxSel=`<select data-k="bxId"><option value="">일반 제품 (보관함 없음)</option>${(S.boxes||[]).map(b=>`<option value="${b.id}" ${r.bxId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`;
 const loss=(k,lab,sm,vals)=>`<div class="loss"><label class="f">${lab} <small>${sm}</small></label><div class="pin">${numIn(k,r[k],'%')}${presets(k,vals,r[k],'%')}</div></div>`;

function srcLine(it){
 if(!it)return '';
 if(it.src==='online')return `온라인 ${esc((it.at||'').slice(5,10).replace('-','/'))} · ${esc(it.mall||'')}`;
 if(it.edited||it.custom)return '이 기기에서 고친 값';
 if(it.src==='buy')return `이카운트 ${esc((it.d||'').slice(2).replace(/-/g,'.'))} 매입${it.prev?(it.p>it.prev?' <b style="color:var(--red)">▲'+num((it.p/it.prev-1)*100)+'%</b>':' <b style="color:var(--grn)">▼'+num((1-it.p/it.prev)*100)+'%</b>'):''}`;
 if(it.src==='stock')return '이카운트 재고 단가 (최근 매입 없음)';
 if(it.src==='est')return '추정값';
 return '';
}
function hintHtml(x,i){
 const ak=autoKp(x.n),ov=x.kp!=null&&x.kp!=='',it=ING_MAP.get(x.n);
 const ob=`<button type="button" class="lk noprint" data-online="${i}">쿠팡·네이버에서 찾기</button>`;
 if(x.n&&!it&&!ov)return `<span class="ps" style="color:var(--org)">이카운트에 없는 재료 · ${ob}</span>`;
 if(ov)return `<span class="ps">이번만 직접 넣은 가격${ak!=null?` (단가표 ${num(ak)}원)`:''}</span>`;
 if(it&&it.staleOv)return `<span class="ps">${srcLine(it)} · 고친 값보다 최근이라 매입가를 씀</span>`;
 if(it&&it.chk&&it.src!=='online'&&!it.edited)return `<span class="ps" style="color:var(--org)">${srcLine(it)} · 확인 필요 · ${ob}</span>`;
 if(it)return `<span class="ps">${srcLine(it)}</span>`;
 return '';
}
function rowHint(tr,x){if(!tr||!x)return;const td=tr.querySelector('td.n');td.querySelectorAll('.ps').forEach(e=>e.remove());td.insertAdjacentHTML('beforeend',hintHtml(x,+tr.dataset.row))}

   if(t.dataset.f==='kp'){const ak=autoKp(x.n);x.kp=(t.value===''||(ak!=null&&Math.abs(N(t.value)-ak)<0.5))?null:t.value;rowHint(tr,x)}
   else x[t.dataset.f]=t.value;
   if(t.dataset.f==='n'){x.kp=null;const it0=ING_MAP.get(x.n);x.c=it0&&it0.c||undefined;const k=autoKp(x.n);const pin=tr.querySelector('[data-f=kp]');pin.value=k!=null?Math.round(k):'';pin.classList.toggle('miss',!!x.n&&k==null)}
   touch();update();return}
  const pi=t.closest('[data-pack]');
  if(pi&&t.dataset.pf){const p=r.packs[+pi.dataset.pack];
   if(t.dataset.pf==='up'){const au=autoUp(p.n);p.up=(t.value===''||(au!=null&&Math.abs(N(t.value)-au)<0.005))?null:t.value}
   else p[t.dataset.pf]=t.value;
   if(t.dataset.pf==='n'){p.up=null;const it1=PACK_MAP.get(p.n);p.c=it1&&it1.c||undefined;const u=autoUp(p.n);const uin=pi.querySelector('[data-pf=up]');uin.value=u!=null?Math.round(u*100)/100:''}
   touch();update();return}
 };
 app.onchange=e=>{const t=e.target;if(t.dataset.k==='bxId'){renderCalcKeep();return}if(t.dataset.f==='n'){const tr=t.closest('[data-row]');rowHint(tr,r.rows[+tr.dataset.row])}};
 app.onclick=e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.pre){r[t.dataset.pre]=+t.dataset.v;const inp=app.querySelector(`[data-k="${t.dataset.pre}"]`);if(inp)inp.value=t.dataset.v;syncPresets(t.dataset.pre);touch();update()}
  else if(t.dataset.scrap){r.scrap=t.dataset.scrap;app.querySelectorAll('[data-scrap]').forEach(b=>b.classList.toggle('on',b===t));touch();update()}
  else if(t.dataset.delrow!=null){r.rows.splice(+t.dataset.delrow,1);if(!r.rows.length)r.rows.push({n:'',g:''});touch();renderCalcKeep()}
  else if(t.dataset.delpack!=null){r.packs.splice(+t.dataset.delpack,1);touch();renderCalcKeep()}
  else if(t.dataset.sec){toggleSec(t.dataset.sec)}

 };

function renderList(){
 const boxes=S.boxes||[];
 if(LB!=='all'&&LB!=='none'&&!boxes.find(b=>b.id===LB))LB='all';
 const inB=p=>LB==='all'?true:LB==='none'?!boxOf(p):p.bxId===LB;
 const q=LQ.trim();
 const hit=p=>{if(!q)return true;const b=boxOf(p)||{};return [p.name,p.memo,b.name,b.by,b.memo].join(' ').includes(q)};
 const list=S.products.filter(p=>inB(p)&&hit(p));
 const bn=(id,label,sub,n)=>`<button type="button" class="bxn ${LB===id?'on':''}" data-lb="${id}"><span><b>${esc(label)}</b>${sub?`<small>${esc(sub)}</small>`:''}</span><em>${n}</em></button>`;
 const nav=`<div class="boxNav noprint">${bn('all','전체 제품','',S.products.length)}${bn('none','일반 제품','보관함에 넣지 않은 제품',S.products.filter(p=>!boxOf(p)).length)}
   <div class="bxh">요청 보관함</div>${boxes.map(b=>bn(b.id,b.name,[b.by,fmtD(b.date)].filter(Boolean).join(' · '),S.products.filter(p=>p.bxId===b.id).length)).join('')||'<p class="help" style="margin:8px 4px">아직 보관함이 없어요.</p>'}
   <button class="btn g" id="bxNew" style="width:100%;margin-top:10px">+ 보관함 만들기</button></div>`;
 const B=boxes.find(b=>b.id===LB);
 const boxInfo=B?`<div class="card"><h2>보관함 · ${esc(B.name)}</h2>
   <table class="kv"><tr><th>요청한 분</th><td>${esc(B.by||'-')}</td></tr><tr><th>요청일</th><td>${esc(fmtD(B.date)||'-')}</td></tr>
   <tr><th>원본 문서</th><td>${(B.files||[]).map(f=>`<div class="fl"><button type="button" class="lk" style="font-size:17px" data-fopen="${f.id}">${esc(f.name)}</button> <small>${num((f.size||0)/1024)}KB · ${esc(fmtD(f.at))} 올림</small> <button type="button" class="lk noprint" data-fdel="${f.id}" style="color:var(--red)">빼기</button></div>`).join('')||'없음'}</td></tr>
   <tr><th>메모</th><td class="pre">${esc(B.memo||'-')}</td></tr></table>
   <div class="bar noprint" style="margin-top:12px"><button class="btn g sm" id="bxEdit">보관함 정보 고치기</button><button class="btn g sm" id="bxFile">원본 문서 올리기</button><button class="btn gr sm" id="bxExp">이 보관함 내보내기</button><button class="btn gr sm" id="bxPrint">요약표 인쇄</button><button class="btn del sm" id="bxDel">보관함 지우기</button><input type="file" id="bxFin" style="display:none"></div></div>`:'';
 const title=LB==='all'?'전체 제품':LB==='none'?'일반 제품':'보관함 제품';
 const rows=list.map(p=>{const c=calc(p),b=boxOf(p);return `<tr data-open="${p.id}"><td><b>${esc(p.name)}</b>${LB==='all'&&b?`<small class="bxt">보관함 · ${esc(b.name)}</small>`:''}</td><td class="r hm">${num(p.pieceW)}g</td><td class="r">${num(c.A)}원</td><td class="r big">${num(c.total)}원</td><td class="r hm">${won(c.batch)}</td><td class="r hm">${new Date(p.updated||0).toLocaleDateString('ko-KR')}</td></tr>`}).join('');
 $('#app').innerHTML=pageHead('저장한 제품','제품을 보관함별로 모아 볼 수 있어요. 요청받은 원가 계산은 보관함에 넣어 두면 나중에 찾기 쉬워요.')+`
 <div class="listGrid">${nav}<div>
  <div class="srch noprint"><label class="f" for="lq" style="margin-top:0">제품·보관함 찾기</label><input id="lq" value="${esc(LQ)}" placeholder="예: 휘낭시에, 부안, 박태일"></div>
  ${boxInfo}
  <div class="card"><h2>${title} <span class="chip b">${list.length}개</span></h2>
   ${list.length?`<table class="pt"><thead><tr><th>제품명</th><th class="r hm">1개 무게</th><th class="r">재료만 1개</th><th class="r">1개 현실 원가</th><th class="r hm">1배합 총원가</th><th class="r hm">수정일</th></tr></thead><tbody>${rows}</tbody></table>`:'<p class="help">찾는 제품이 없어요.</p>'}
   <button class="btn noprint" id="lNew" style="width:100%;margin-top:12px">+ 새 제품 만들기${B?' (이 보관함에)':''}</button></div>
  <div class="g2 noprint">
   <div class="card"><h2>다른 기기로 옮기기</h2><p class="help">저장 내용은 <b>이 기기(이 브라우저)에만</b> 남아요. 다른 기기에서 보려면 파일로 내보낸 뒤 그 기기에서 가져오기 하세요. 보관함과 원본 문서도 함께 옮겨져요.</p>
    <div class="bar"><button class="btn g" id="lExp">파일로 내보내기</button><button class="btn g" id="lImp">파일 가져오기</button><input type="file" id="lFile" accept=".json,application/json" style="display:none"></div></div>
   <div class="card"><h2>처음 예시로 되돌리기</h2><p class="help">예시 제품(피자도우, 굴뚝빵)만 다시 넣어요. 내가 만든 제품은 지우지 않아요.</p><button class="btn gr" id="lSample">예시 제품 다시 넣기</button></div>
  </div></div></div>`;
 bindList(B);
}
function bindList(B){
 document.querySelectorAll('[data-lb]').forEach(e=>e.onclick=()=>{LB=e.dataset.lb;renderList()});
 $('#lq').oninput=e=>{LQ=e.target.value;clearTimeout(window._lqT);window._lqT=setTimeout(()=>{const y=scrollY;renderList();window.scrollTo(0,y);const i=$('#lq');i.focus();i.setSelectionRange(i.value.length,i.value.length)},350)};
 document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{S.cur=e.dataset.open;setTab('calc')});
 $('#lNew').onclick=()=>{const p=blank();if(B)p.bxId=B.id;S.products.push(p);S.cur=p.id;setTab('calc')};
 $('#bxNew').onclick=()=>editBox(null);
 $('#lSample').onclick=()=>{S.products.push(...samples());save();renderList();toast('예시 제품을 넣었어요')};
 $('#lExp').onclick=()=>exportData(null);
 $('#lImp').onclick=()=>$('#lFile').click();
 $('#lFile').onchange=e=>{const f=e.target.files[0];e.target.value='';importFile(f)};
 if(!B)return;
 $('#bxEdit').onclick=()=>editBox(B);
 $('#bxFile').onclick=()=>$('#bxFin').click();
 $('#bxFin').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>20*1024*1024){alert('20MB보다 큰 파일은 올릴 수 없어요.');return}
  const id='f'+uid().slice(1);
  try{await FDB.put(id,{name:f.name,type:f.type,blob:f});B.files=B.files||[];B.files.push({id,name:f.name,size:f.size,at:new Date().toISOString()});B.updated=Date.now();save(true);renderList();toast('원본 문서를 보관함에 넣었어요')}
  catch(_){alert('파일을 저장하지 못했어요. 기기 저장 공간을 확인해 주세요.')}};
 $('#bxExp').onclick=()=>exportData(B);
 $('#bxPrint').onclick=()=>window.print();
 $('#bxDel').onclick=async()=>{if(!confirm(`보관함 「${B.name}」을(를) 지울까요?\n안의 제품은 지우지 않고 「일반 제품」으로 옮겨요.`))return;
  S.products.forEach(p=>{if(p.bxId===B.id)p.bxId=''});for(const f of B.files||[]){try{await FDB.del(f.id)}catch(_){}}
  S.boxes=S.boxes.filter(b=>b!==B);LB='all';save();renderList()};
 document.querySelectorAll('[data-fopen]').forEach(e=>e.onclick=()=>openFile(e.dataset.fopen));
 document.querySelectorAll('[data-fdel]').forEach(e=>e.onclick=async()=>{if(!confirm('이 문서를 보관함에서 뺄까요?'))return;try{await FDB.del(e.dataset.fdel)}catch(_){}
  B.files=(B.files||[]).filter(f=>f.id!==e.dataset.fdel);B.updated=Date.now();save();renderList()});
}
async function openFile(id){
 try{const v=await FDB.get(id);if(!v){alert('이 기기에는 원본 문서가 없어요. 문서를 올린 기기에서 「이 보관함 내보내기」 파일을 받아 「파일 가져오기」 하세요.');return}
  const u=URL.createObjectURL(v.blob);
  if(/pdf|image/.test(v.type||''))window.open(u,'_blank');
  else{const a=document.createElement('a');a.href=u;a.download=v.name;document.body.appendChild(a);a.click();a.remove();toast('내려받았어요. 한글(한컴) 프로그램으로 열어 주세요')}
  setTimeout(()=>URL.revokeObjectURL(u),60000)}
 catch(_){alert('문서를 열지 못했어요.')}
}
function editBox(B){
 const w=document.createElement('div');w.id='olBg';
 w.innerHTML=`<div class="olBox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:22px;color:var(--nv)">${B?'보관함 정보 고치기':'새 보관함 만들기'}</h2><button class="xb" id="bxX" style="color:var(--ink)">×</button></div>
  <label class="f">보관함 이름</label><input id="bxN" value="${esc(B?B.name:'')}" placeholder="예: 부안 특산물 디저트">
  <div class="row2"><div><label class="f">요청한 분</label><input id="bxBy" value="${esc(B?B.by||'':'')}" placeholder="예: ○○ 상무"></div>
  <div><label class="f">요청일</label><input id="bxD" type="date" value="${esc(B?B.date||'':todayStr())}"></div></div>
  <label class="f">메모 <small>(요청 내용, 확인할 것)</small></label><textarea id="bxM" rows="5">${esc(B?B.memo||'':'')}</textarea>
  <button class="btn" id="bxOk" style="width:100%;margin-top:14px">저장</button></div>`;
 document.body.appendChild(w);
 const g=id=>w.querySelector('#'+id),close=()=>w.remove();
 g('bxX').onclick=close;w.onclick=e=>{if(e.target===w)close()};
 g('bxOk').onclick=()=>{const n=g('bxN').value.trim();if(!n){alert('보관함 이름을 넣어 주세요.');return}
  const o=B||{id:'b'+uid().slice(1),files:[],created:Date.now()};
  Object.assign(o,{name:n,by:g('bxBy').value.trim(),date:g('bxD').value,memo:g('bxM').value.trim(),updated:Date.now()});
  if(!B){S.boxes=S.boxes||[];S.boxes.push(o);LB=o.id}
  save();close();renderList();toast(B?'보관함 정보를 고쳤어요':'보관함을 만들었어요')};
 setTimeout(()=>g('bxN').focus(),50);
}
async function exportData(B){
 const boxes=B?[B]:(S.boxes||[]),products=B?S.products.filter(p=>p.bxId===B.id):S.products,files=[];
 for(const b of boxes)for(const f of b.files||[]){try{const v=await FDB.get(f.id);if(v)files.push({id:f.id,name:v.name,type:v.type,data:await blobToUrl(v.blob)})}catch(_){}}
 const blob=new Blob([JSON.stringify({app:'drawbread_cost',ver:APP_VER,at:new Date().toISOString(),products,prices:S.prices,packs:S.packs,boxes,files},null,1)],{type:'application/json'});
 const d=new Date(),ds=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=B?`원가계산기_보관함_${B.name.replace(/[\\/:*?"<>|]/g,'')}_${ds}.json`:`원가계산기_${ds}.json`;
 a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function importFile(f){
 if(!f)return;
 try{const j=JSON.parse(await f.text());if(j.app!=='drawbread_cost'||!Array.isArray(j.products))throw 0;
  let add=0,upd=0,bx=0;S.boxes=S.boxes||[];
  (j.boxes||[]).forEach(b=>{const i=S.boxes.findIndex(x=>x.id===b.id);if(i<0){S.boxes.push(b);bx++}else if((b.updated||0)>=(S.boxes[i].updated||0)){S.boxes[i]=b;bx++}});
  for(const x of j.files||[]){try{await FDB.put(x.id,{name:x.name,type:x.type,blob:await urlToBlob(x.data)})}catch(_){}}
  j.products.forEach(p=>{const i=S.products.findIndex(x=>x.id===p.id);if(i<0){S.products.push(p);add++}else if((p.updated||0)>(S.products[i].updated||0)){S.products[i]=p;upd++}});
  Object.assign(S.prices,j.prices||{});Object.assign(S.packs,j.packs||{});refreshMaps();save(true);
  if(j.boxes&&j.boxes.length===1)LB=j.boxes[0].id;
  renderList();toast(`새 제품 ${add}개, 최신으로 바뀐 제품 ${upd}개${bx?`, 보관함 ${bx}개`:''}`)}
 catch(_){alert('원가 계산기에서 내보낸 파일이 아니에요.')}
}

/* 단가표 */
let PQ='',PT='ing';
function renderPrice(){
 const cnt=PD?PD.ing.filter(x=>x.src==='buy').length:0;
 $('#app').innerHTML=pageHead('단가표','이카운트 최근 매입가와 이 기기에서 넣은 단가예요. 매일 아침 새 매입가가 자동으로 들어와요.')+priceBanner()+`
 <div class="priceGrid"><div class="card"><h2>품목별 단가</h2>
  <p class="help">${PD?`<b>${esc(priceBase())}</b> · 이카운트 매입가 ${num(cnt)}개 · 포장재 ${num(PD.pack.length)}개. 매일 아침 자동으로 새 매입가가 들어와요.`:'아직 단가표를 받지 않았어요.'}
   모든 값은 공급가(부가세 별도)예요. <span class="chip o">확인 필요</span>는 최근 매입 기록이 없는 품목이에요.</p>
  <div class="bar noprint" style="margin-bottom:10px"><button class="btn g sm" id="pReload">단가표 다시 받기</button></div>
  <div class="seg" style="margin-bottom:10px"><button type="button" data-pt="ing" class="${PT==='ing'?'on':''}">원료</button><button type="button" data-pt="dough" class="${PT==='dough'?'on':''}">생지</button><button type="button" data-pt="pack" class="${PT==='pack'?'on':''}">포장재</button></div>
  <input id="pq" placeholder="찾기 (예: 버터, 소금)" value="${esc(PQ)}">
  <div id="plist" style="margin-top:6px"></div></div>
 <div class="card"><h2>이카운트에 없는 품목 추가</h2>
  <p class="help">쿠팡·네이버쇼핑에서 찾아 고르거나, 아는 가격을 직접 넣으세요.</p>
  <label class="f">이름</label><input id="nN" placeholder="${PT==='pack'?'예: 피자 박스':'예: 엑스트라버진 올리브오일'}">
  ${PT!=='pack'?'<button class="btn" id="nOnline" style="width:100%;margin-top:10px">쿠팡·네이버에서 찾아서 추가</button><p class="help" style="margin:10px 0 0">또는 직접 넣기</p>':''}
  <div class="row2"><div><label class="f">포장 가격 (원, 부가세 빼고)</label><input id="nP" type="number" inputmode="decimal"></div>
  <div><label class="f">${PT!=='pack'?'포장 무게 (g)':'포장 안 개수'}</label><input id="nG" type="number" inputmode="decimal" placeholder="${PT!=='pack'?'예: 1000':'예: 100'}"></div></div>
  <button class="btn g" id="nAdd" style="width:100%;margin-top:12px">직접 넣어 추가하기</button></div></div>`;
 document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{PT=b.dataset.pt;renderPrice()});
 $('#pq').oninput=e=>{PQ=e.target.value;drawP()};
 $('#pReload').onclick=async()=>{toast('단가표 받는 중…');const ch=await loadPrices(true);refreshMaps();renderPrice();toast(PSTAT==='ok'?'최신 단가표예요':'받지 못했어요')};
 if($('#nOnline'))$('#nOnline').onclick=()=>{const n=$('#nN').value.trim();openOnline(n,(name)=>{PQ=name;renderPrice()})};
 $('#nAdd').onclick=()=>{const n=$('#nN').value.trim(),p=N($('#nP').value),g=N($('#nG').value);if(!n||!(g>0)){alert('이름과 '+(PT!=='pack'?'포장 무게':'개수')+'를 넣어 주세요.');return}
  const at=new Date().toISOString();
  if(PT!=='pack')S.prices[n]={p,g,s:'직접 추가',at};else S.packs[n]={p,k:g,s:'직접 추가',at};
  refreshMaps();save();PQ=n;renderPrice()};
 drawP();
}
function drawP(){
 const isP=PT==='pack';
 let list=(isP?[...PACK_MAP.values()]:[...ING_MAP.values()].filter(x=>PT==='dough'?x.cat==='생지':x.cat!=='생지'));
 const q=PQ.trim();if(q)list=list.filter(x=>x.n.includes(q)||(x.n0||'').includes(q)||(x.c||'').includes(q));
 list.sort((a,b)=>(a.src==='fix')-(b.src==='fix')||a.n.localeCompare(b.n,'ko'));
 const shown=list.slice(0,q?200:80);
 $('#plist').innerHTML='<div class="plh"><span>품목</span><span style="text-align:right">1kg 단가</span><span>포장 가격(원)</span><span>포장 무게·개수</span><span></span><span></span></div>'+(list.length>shown.length?`<p class="help">${num(list.length)}개 중 ${shown.length}개만 보여요. 찾기 칸에 이름을 넣으세요.</p>`:'')+shown.map(x=>{
  const unit=!isP?(N(x.g)>0?`1kg ${num(N(x.p)/N(x.g)*1000)}원`:'-'):`1개 ${num(N(x.p)/(N(x.k)||1),1)}원`;
  const pack=!isP?`${num(x.g)}g ${won(x.p)}`:`${num(x.k||1)}개 ${won(x.p)}`;
  const chips=(x.chk&&!x.edited&&x.src!=='online'?'<span class="chip o">확인 필요</span> ':'')+(x.src==='online'?'<span class="chip b">온라인</span> ':'')+(x.edited&&x.src!=='online'?'<span class="chip g">고침</span> ':'')+(x.custom&&x.src!=='online'?'<span class="chip b">추가</span> ':'');
  const sub=[srcLine(x),x.cust&&x.src==='buy'?esc(x.cust):'',x.prev&&x.src==='buy'?`직전 ${won(x.prev)}`:'',x.s&&x.src!=='buy'?esc(x.s):'',x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">상품 보기</a>`:''].filter(Boolean).join(' · ');
  return `<div class="pi" data-pn="${esc(x.n)}"><div class="top"><div><b>${esc(x.n)}</b> ${chips}
   <div class="s">${pack} · ${sub}</div>${x.staleOv?'<div class="s" style="color:var(--blu)">이 기기에서 고친 값이 있었지만, 그 뒤 이카운트 매입가가 새로 들어와서 매입가를 써요.</div>':''}</div><div class="kg">${unit}</div></div>
   <div class="ed"><div><label class="f" style="font-size:15.5px">포장 가격(원)</label><input type="number" inputmode="decimal" data-pe="p" value="${esc(x.p)}"></div>
   <div><label class="f" style="font-size:15.5px">${!isP?'포장 무게(g)':'포장 안 개수'}</label><input type="number" inputmode="decimal" data-pe="${!isP?'g':'k'}" value="${esc(!isP?x.g:(x.k||1))}"></div>
   <button class="btn sm" data-psave>저장</button>${x.edited||x.custom?`<button class="btn gr sm" data-preset>${x.custom?'삭제':'매입가로'}</button>`:(!isP&&x.src!=='buy'&&x.src!=='fix'?'<button class="btn g sm" data-pon>온라인 찾기</button>':'<span></span>')}</div></div>`}).join('')||'<p class="help">찾는 품목이 없어요. 아래에서 추가하세요.</p>';
 $('#plist').onclick=e=>{const b=e.target.closest('button');if(!b)return;const pi=b.closest('[data-pn]'),n=pi.dataset.pn,store=isP?S.packs:S.prices;
  if(b.hasAttribute('data-psave')){const p=N(pi.querySelector('[data-pe=p]').value),qq=N(pi.querySelector(`[data-pe=${!isP?'g':'k'}]`).value);if(!(qq>0)){alert('무게(개수)를 넣어 주세요.');return}
   const o={p,s:'직접 고침',at:new Date().toISOString()};if(!isP)o.g=qq;else o.k=qq;store[n]=o;refreshMaps();save();drawP()}
  else if(b.hasAttribute('data-preset')){delete store[n];refreshMaps();save();drawP()}
  else if(b.hasAttribute('data-pon')){openOnline(n,()=>drawP())}};
}

/* 온라인 조회 (쿠팡·네이버쇼핑 검색창 열기 → 고른 상품 붙여넣기) */
function parseShop(t){
 t=String(t||'');const o={};
 const u=t.match(/https?:\/\/[^\s<>"']+/);if(u)o.url=u[0];
 o.mall=/coupang/i.test(t)||/쿠팡/.test(t)?'쿠팡':/naver|네이버|smartstore/i.test(t)?'네이버쇼핑':/11st|11번가/i.test(t)?'11번가':/gmarket|지마켓/i.test(t)?'G마켓':'';
 let title=t.replace(/https?:\/\/[^\s]+/g,'').replace(/\[(쿠팡|네이버[^\]]*)\]/g,'').split(/\n/).map(s=>s.trim()).filter(s=>s&&!/^(쿠팡|공유|링크)/.test(s))[0]||'';
 o.title=title.replace(/\s*(\d{1,3}(?:,\d{3})+|\d{3,7})\s*원.*$/,'').slice(0,120);
 const pr=[...t.matchAll(/(\d{1,3}(?:,\d{3})+|\d{3,7})\s*원/g)].map(m=>N(m[1]));if(pr.length)o.price=pr[0];
 o.g=parseQty(o.title||t);
 return o;
}
function parseQty(s){
 s=String(s||'');const U=(v,u)=>/kg|l|리터/i.test(u)?v*1000:v;
 let m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])\s*[x×*X]\s*(\d+)/i);if(m)return U(+m[1],m[2])*+m[3];
 m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])[^\d]{0,6}?(\d+)\s*(개|입|팩|병|봉|통|EA)/i);if(m)return U(+m[1],m[2])*+m[3];
 m=s.match(/(\d+(?:\.\d+)?)\s*(kg|g|ml|l|리터)(?![a-z])/i);if(m)return U(+m[1],m[2]);
 return null;
}
function openOnline(name,done){
 name=name||'';
 const q0=name.replace(/\(.*?\)/g,'').replace(/[_]/g,' ').trim();
 const w=document.createElement('div');w.id='olBg';
 w.innerHTML=`<div class="olBox">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:21px">온라인에서 단가 찾기</h2><button class="xb" id="olX" style="color:var(--ink)">×</button></div>
  <label class="f">재료 이름 <small>(원가 계산에 쓰는 이름)</small></label><input id="olN" value="${esc(name)}" placeholder="예: 엑스트라버진 올리브오일">
  <label class="f">① 검색어</label><input id="olQ" value="${esc(q0)}">
  <div class="row2" style="margin-top:8px"><button class="btn" id="olC" style="background:#E3242B">쿠팡에서 찾기</button><button class="btn" id="olV" style="background:#03A94D">네이버쇼핑에서 찾기</button></div>
  <p class="help" style="margin-top:8px">새 창에서 상품을 고른 뒤 <b>공유 → 링크 복사</b>(또는 상품명·가격 복사)를 하고, 이 화면으로 돌아와 아래에 붙여 넣으세요.</p>
  <label class="f">② 고른 상품 붙여넣기</label><textarea id="olT" rows="3" style="font-size:17.5px" placeholder="예: [쿠팡] 코끼리 올리브오일 엑스트라버진 1L x 2개 23,900원 https://link.coupang.com/..."></textarea>
  <label class="f">상품명</label><input id="olTi">
  <div class="row2">
   <div><label class="f">판매 가격 <small>(원, 묶음 전체)</small></label><input id="olP" type="number" inputmode="decimal"></div>
   <div><label class="f">배송비 <small>(원)</small></label><input id="olS" type="number" inputmode="decimal" value="0"></div>
   <div><label class="f">총 용량 <small>(g, 묶음 전체)</small></label><input id="olG" type="number" inputmode="decimal" placeholder="상품명에서 자동"></div>
   <div><label class="f">링크</label><input id="olU" placeholder="https://"></div>
  </div>
  <label style="display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:17px"><input type="checkbox" id="olVat" checked style="width:26px;min-height:26px;margin-top:2px"><span>부가세 빼고 계산 (가격 ÷ 1.1)<br><small style="color:var(--sub)">이카운트 매입가와 같은 기준. 밀가루·계란·채소처럼 가공하지 않은 농산물(면세)은 체크를 끄세요.</small></span></label>
  <div class="info" id="olR">가격과 용량을 넣으면 1kg 가격이 나와요.</div>
  <button class="btn" id="olOk" style="width:100%;margin-top:12px">이 가격으로 원가에 반영</button>
 </div>`;
 document.body.appendChild(w);
 const g=id=>w.querySelector('#'+id);
 const calcR=()=>{const p=N(g('olP').value)+N(g('olS').value),gg=N(g('olG').value),v=g('olVat').checked;
  if(p>0&&gg>0){const pp=v?p/1.1:p;g('olR').innerHTML=`포장 가격 <b>${won(pp)}</b>${v?' (부가세 뺀 값)':''} · 용량 ${num(gg)}g → <b>1kg ${num(pp/gg*1000)}원</b>`}else g('olR').textContent='가격과 용량을 넣으면 1kg 가격이 나와요.'};
 const close=()=>w.remove();
 g('olX').onclick=close;w.onclick=e=>{if(e.target===w)close()};
 g('olC').onclick=()=>window.open('https://www.coupang.com/np/search?q='+encodeURIComponent(g('olQ').value),'_blank');
 g('olV').onclick=()=>window.open('https://search.shopping.naver.com/search/all?query='+encodeURIComponent(g('olQ').value),'_blank');
 g('olT').oninput=()=>{const o=parseShop(g('olT').value);if(o.title)g('olTi').value=o.title;if(o.price)g('olP').value=o.price;if(o.g)g('olG').value=o.g;if(o.url)g('olU').value=o.url;w._mall=o.mall;calcR()};
 g('olTi').oninput=()=>{const q=parseQty(g('olTi').value);if(q&&!g('olG').value)g('olG').value=q;calcR()};
 ['olP','olS','olG','olVat'].forEach(id=>g(id).oninput=g(id).onchange=calcR);
 g('olOk').onclick=()=>{const n=g('olN').value.trim(),p=N(g('olP').value)+N(g('olS').value),gg=N(g('olG').value),v=g('olVat').checked;
  if(!n){alert('재료 이름을 넣어 주세요.');return}if(!(p>0)||!(gg>0)){alert('판매 가격과 총 용량을 넣어 주세요.');return}
  const url=g('olU').value.trim();const mall=w._mall||(/coupang/i.test(url)?'쿠팡':/naver/i.test(url)?'네이버쇼핑':'온라인');
  S.prices[n]={p:Math.round((v?p/1.1:p)*100)/100,g:gg,src:'online',mall,title:g('olTi').value.trim(),url,vat:v,at:new Date().toISOString(),s:`${mall} ${g('olTi').value.trim()}`.slice(0,90)};
  refreshMaps();save();close();toast('원가에 반영했어요');if(done)done(n)};
 setTimeout(()=>g(name?'olQ':'olN').focus(),50);
}

/* 시작: 저장된 단가표로 먼저 그리고, 새 단가표를 받으면 다시 그림 */
loadPrices(false).then(ch=>{refreshMaps();if(ch||PSTAT!=='ok')render()});
render();
</script>
</body>
