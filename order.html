<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#173F4B">
<title>빵을그리다 주문서</title>
<link rel="icon" href="icon_192.png">
<link rel="apple-touch-icon" href="icon_192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="빵을그리다">
<meta property="og:title" content="빵을그리다 주문서">
<meta property="og:description" content="거래처 전용 주문서 — 눌러서 주문하세요">
<meta property="og:url" content="https://lee1812-oss.github.io/wonryo/order.html?s=2">
<meta property="og:image" content="https://lee1812-oss.github.io/wonryo/og_order.png?s=2">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="400">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#EEF1F3;--paper:#fff;--ink:#16232B;--ink2:#4A5A65;--ink3:#8291A0;--line:#D6DDE3;--line2:#EAEEF1;--brand:#173F4B;--accent:#0E7C6B;--accent-bg:#E3F3EF;--warn:#A86A12;--warn-bg:#FBF1DF;--minus:#B23A3A;--minus-bg:#FBE9E9;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,textarea{font:inherit}
.top{background:var(--brand);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px;border-radius:11px;background:#FBF6EE;object-fit:contain}.top h1{margin:0;font-size:17px;letter-spacing:-.3px}.top small{display:block;font-size:13px;opacity:.8;margin-top:1px}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.card h2 span{font-size:12px;color:var(--ink3);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:96px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;background:#fff}
.day b{display:block;font-size:16px}.day i{font-style:normal;font-size:11.5px;color:var(--ink3)}.day.on{border-color:var(--accent);background:var(--accent-bg)}.day.on b{color:var(--accent)}
.tools{display:flex;gap:8px;margin-bottom:8px}.tools input{flex:1 1 auto;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;white-space:nowrap}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}.it:first-child{border-top:0}.it.on .nm b{color:var(--accent)}
.nm{flex:1 1 auto;min-width:0}.nm b{display:block;font-size:14.5px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}.nm span{font-size:12px;color:var(--ink3)}
.st{flex:0 0 auto;display:grid;grid-template-columns:38px 54px 38px;height:40px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.st button{font-size:20px;font-weight:700;color:var(--ink2);background:var(--bg)}.st button:active{background:var(--line)}
.st input{border:0;width:100%;text-align:center;font-size:17px;font-weight:800;color:var(--ink);outline:none}.it.on .st{border-color:var(--accent)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--bg)}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}.row2 label{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}.row2 input{flex:1 1 auto;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}.bar .sum{flex:1 1 auto;min-width:0;font-size:13px;color:var(--ink2)}.bar .sum b{display:block;font-size:17px;color:var(--ink)}
.bar .btn{height:48px;padding:0 22px;font-size:16px}
.ord{padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px}.ord:first-of-type{border-top:0}.ord .h{display:flex;justify-content:space-between;gap:8px}.ord .l{color:var(--ink2);font-size:12.5px;margin-top:3px}
.tg{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px}.tg.new{background:var(--warn-bg);color:var(--warn)}.tg.ok{background:var(--accent-bg);color:var(--accent)}.tg.bad{background:var(--minus-bg);color:var(--minus)}
.msg{text-align:center;padding:36px 16px;color:var(--ink2);line-height:1.7}.msg b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet>div{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}.sl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.sl td{padding:7px 4px;border-bottom:1px solid var(--line2)}.sl td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.sheet .btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.sheet .btn{height:50px;font-size:16px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin-bottom:12px;line-height:1.5}
.err{color:var(--minus);font-size:13px;margin-top:6px}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:16px}
</style>
</head>
<body>
<header class="top"><img src="brand_logo.png" alt="빵을그리다"><div><h1>빵을그리다 주문서</h1><small id="who">불러오는 중…</small></div></header>
<main id="app"><div class="msg">주문서를 불러오는 중입니다…</div></main>
<div class="bar" id="bar" hidden><div><div class="sum" id="sum"></div><button class="btn pri" id="go" disabled>주문하기</button></div></div>
<div class="sheet" id="sheet" hidden><div id="sheetIn"></div></div>
<script>
/* 빵을그리다 거래처 주문서 — 주소의 #t=토큰 으로 그 거래처의 주문서만 열림. 이 파일에는 거래처·품목 자료가 없음 */
(function () {
  'use strict';
  var RELAY = 'https://script.google.com/macros/s/AKfycbwc4iYf-iUXLIkw_9mENM2nRyX5BNdz4TveLP5cKE-5CXd2hiTQ34kDxSanQFJk9O8S3g/exec';
  var H = new URLSearchParams(location.hash.replace(/^#/, '')), T = (H.get('t') || '').replace(/[^A-Za-z0-9_-]/g, '');
  if (H.get('r')) RELAY = 'https://script.google.com/macros/s/' + H.get('r').replace(/[^A-Za-z0-9_-]/g, '') + '/exec';
  var $ = function (s) { return document.querySelector(s); }, WD = '일월화수목금토';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var won = function (n) { return Math.round(n || 0).toLocaleString('ko-KR'); };
  var LS = 'bggd_order_' + T.slice(0, 10), F = null, ORD = [], st = { q: {}, ship: '', memo: '', who: '', find: '' }, cid = '';
  function load() { try { var o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) { st.q = o.q || {}; st.memo = o.memo || ''; st.who = o.who || ''; st.ship = o.ship || ''; } } catch (e) {} }
  function keep() { try { localStorage.setItem(LS, JSON.stringify({ q: st.q, memo: st.memo, who: st.who, ship: st.ship })); } catch (e) {} }
  function call(body) { return fetch(RELAY, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function ymd(d) { return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  /* 주문 가능한 배송일: 허용 요일 · (배송일 - lead일) cut시(한국 시각) 전 — 중계와 같은 규칙 */
  function shipDays() { var out = [], now = Date.now(), k = new Date(now + 9 * 3600000), y = k.getUTCFullYear(), m = k.getUTCMonth(), d0 = k.getUTCDate();
    for (var i = 0; i < 28 && out.length < 6; i++) { var d = new Date(Date.UTC(y, m, d0 + i)); if ((F.days || []).indexOf(d.getUTCDay()) < 0) continue;
      var dl = Date.UTC(y, m, d0 + i - (F.lead || 0), F.cut == null ? 15 : F.cut) - 9 * 3600000; if (now < dl) out.push({ v: ymd(d), d: d, dl: new Date(dl + 9 * 3600000) }); }
    return out; }
  function md(d) { return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + WD[d.getUTCDay()] + ')'; }
  function picked() { return F.items.filter(function (it) { return (st.q[it[0]] || 0) > 0; }); }
  function sumHtml() { var p = picked(), n = p.reduce(function (t, it) { return t + st.q[it[0]]; }, 0), a = F.price ? p.reduce(function (t, it) { return t + (it[2] || 0) * st.q[it[0]]; }, 0) : 0;
    $('#sum').innerHTML = p.length ? '<b>' + p.length + '품목 · ' + n + '개</b>' + (F.price ? '공급가 ' + won(a) + '원 (부가세 별도)' : (st.ship ? '배송 ' + esc(md(new Date(st.ship + 'T00:00:00Z'))) : '배송일을 고르세요')) : '<b>품목을 담아 주세요</b>수량을 넣으면 여기에 모입니다';
    $('#go').disabled = !p.length || !st.ship; }
  function render() {
    var days = shipDays(); if (!days.some(function (x) { return x.v === st.ship; })) st.ship = days[0] ? days[0].v : '';
    var q = st.find.trim().toLowerCase().replace(/\s/g, ''), list = F.items.filter(function (it) { return !q || String(it[1]).toLowerCase().replace(/\s/g, '').indexOf(q) >= 0 || String(it[0]).toLowerCase().indexOf(q) >= 0; });
    var hasLast = (F.last || []).some(function (x) { return x[1] > 0; });
    $('#app').innerHTML = (F.note ? '<div class="note">' + esc(F.note) + '</div>' : '') +
      '<section class="card"><h2>배송일 <span>' + (days.length ? '마감 전 날짜만 고를 수 있어요' : '') + '</span></h2>' + (days.length ? '<div class="days">' + days.map(function (x) { return '<button class="day' + (x.v === st.ship ? ' on' : '') + '" data-day="' + x.v + '"><b>' + md(x.d) + '</b><i>' + (x.dl.getUTCMonth() + 1) + '/' + x.dl.getUTCDate() + ' ' + x.dl.getUTCHours() + '시 마감</i></button>'; }).join('') + '</div>' : '<div class="err">지금 고를 수 있는 배송일이 없습니다 — 빵을그리다에 문의해 주세요</div>') + '</section>' +
      '<section class="card"><h2>품목 <span>' + F.items.length + '가지</span></h2><div class="tools">' + (F.items.length > 10 ? '<input id="find" placeholder="품목 찾기" value="' + esc(st.find) + '">' : '<span style="flex:1"></span>') + (hasLast ? '<button class="btn" id="last">지난번과 같이</button>' : '') + (picked().length ? '<button class="btn" id="clr">비우기</button>' : '') + '</div>' +
      '<div id="items">' + list.map(function (it) { var v = st.q[it[0]] || 0; return '<div class="it' + (v ? ' on' : '') + '"><div class="nm"><b>' + esc(it[1]) + '</b><span>' + (F.price && it[2] != null ? won(it[2]) + '원' : '') + (it[3] ? (F.price && it[2] != null ? ' · ' : '') + '지난번 ' + it[3] : '') + '</span></div><div class="st"><button data-d="-1" data-c="' + esc(it[0]) + '" aria-label="줄이기">−</button><input inputmode="numeric" data-c="' + esc(it[0]) + '" value="' + (v || '') + '" placeholder="0" aria-label="' + esc(it[1]) + ' 수량"><button data-d="1" data-c="' + esc(it[0]) + '" aria-label="늘리기">+</button></div></div>'; }).join('') + (list.length ? '' : '<div class="msg">찾는 품목이 없습니다</div>') + '</div></section>' +
      '<section class="card"><h2>요청사항 <span>선택</span></h2><textarea id="memo" placeholder="예: 오전 배송 부탁드려요">' + esc(st.memo) + '</textarea><div class="row2"><label for="whoIn">주문하시는 분</label><input id="whoIn" value="' + esc(st.who) + '" placeholder="이름 (선택)"></div></section>' +
      (ORD.length ? '<section class="card"><h2>최근 주문</h2>' + ORD.map(function (o) { var s = o.status === 'new' ? '<i class="tg new">접수됨</i>' : o.status === 'reject' ? '<i class="tg bad">반려</i>' : o.slip ? '<i class="tg ok">출고 준비 (전표 ' + esc(o.slip) + ')</i>' : '<i class="tg ok">확인 완료</i>';
        return '<div class="ord"><div class="h"><b>배송 ' + esc(md(new Date(o.ship + 'T00:00:00Z'))) + '</b>' + s + '</div><div class="l">' + o.lines.map(function (l) { return esc(l[1]) + ' ' + l[2]; }).join(' · ') + '</div><div class="l">' + esc(new Date(o.at).toLocaleString('ko-KR')) + ' 주문' + (o.note ? ' · ' + esc(o.note) : '') + '</div></div>'; }).join('') + '</section>' : '') +
      '<div class="foot">빵을그리다(주) · ☎ 031-762-1533<br>이 주소는 거래처 전용입니다. 다른 곳에 공유하지 마세요.</div>';
    $('#bar').hidden = false; sumHtml(); bind(); }
  function setQ(c, v) { v = Math.max(0, Math.min(9999, Math.floor(Number(v) || 0))); if (v) st.q[c] = v; else delete st.q[c]; keep();
    var inp = document.querySelector('#items input[data-c="' + CSS.escape(c) + '"]'); if (inp && document.activeElement !== inp) inp.value = v || ''; if (inp) inp.closest('.it').classList.toggle('on', !!v); sumHtml(); }
  function bind() {
    document.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { st.ship = b.getAttribute('data-day'); keep(); document.querySelectorAll('[data-day]').forEach(function (x) { x.classList.toggle('on', x === b); }); sumHtml(); }; });
    var items = $('#items'); items.onclick = function (e) { var b = e.target.closest('button[data-d]'); if (!b) return; var c = b.getAttribute('data-c'); setQ(c, (st.q[c] || 0) + Number(b.getAttribute('data-d'))); };
    items.oninput = function (e) { var i = e.target; if (!i.matches('input[data-c]')) return; i.value = i.value.replace(/[^\d]/g, ''); setQ(i.getAttribute('data-c'), i.value); };
    if ($('#find')) $('#find').oninput = function (e) { st.find = e.target.value; var pos = e.target.selectionStart; render(); var f = $('#find'); f.focus(); try { f.setSelectionRange(pos, pos); } catch (er) {} };
    if ($('#last')) $('#last').onclick = function () { (F.last || []).forEach(function (x) { if (x[1] > 0 && F.items.some(function (it) { return it[0] === x[0]; })) st.q[x[0]] = x[1]; }); keep(); render(); };
    if ($('#clr')) $('#clr').onclick = function () { if (!confirm('담은 수량을 모두 지울까요?')) return; st.q = {}; keep(); render(); };
    $('#memo').oninput = function (e) { st.memo = e.target.value; keep(); }; $('#whoIn').oninput = function (e) { st.who = e.target.value; keep(); };
  }
  function sheet(html) { if (!html) { $('#sheet').hidden = true; return; } $('#sheetIn').innerHTML = html; $('#sheet').hidden = false; }
  $('#sheet').onclick = function (e) { if (e.target.id === 'sheet') sheet(); };
  $('#go').onclick = function () { var p = picked(); if (!p.length || !st.ship) return; if (!cid) cid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var a = F.price ? p.reduce(function (t, it) { return t + (it[2] || 0) * st.q[it[0]]; }, 0) : 0;
    sheet('<h3>주문을 확정할까요?</h3><div style="color:var(--ink2);font-size:14px">' + esc(F.name) + ' · 배송 <b>' + esc(md(new Date(st.ship + 'T00:00:00Z'))) + '</b></div><table class="sl">' + p.map(function (it) { return '<tr><td>' + esc(it[1]) + '</td><td>' + st.q[it[0]] + '</td></tr>'; }).join('') + '</table>' +
      (F.price ? '<div style="text-align:right;font-size:14px">공급가 <b>' + won(a) + '원</b> <span style="color:var(--ink3)">(부가세 별도)</span></div>' : '') + (st.memo ? '<div style="font-size:13px;color:var(--ink2);margin-top:6px">요청사항: ' + esc(st.memo) + '</div>' : '') +
      '<div class="err" id="sErr"></div><div class="btns"><button class="btn" id="sBack">수정</button><button class="btn pri" id="sOk">주문 확정</button></div>');
    $('#sBack').onclick = function () { sheet(); };
    $('#sOk').onclick = function () { var b = $('#sOk'); b.disabled = true; b.textContent = '보내는 중…';
      call({ action: 'orderSubmit', t: T, cid: cid, ship: st.ship, memo: st.memo, who: st.who, lines: p.map(function (it) { return [it[0], st.q[it[0]]]; }) }).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.error) || '주문을 보내지 못했습니다');
        cid = ''; var o = r.order; st.q = {}; st.memo = ''; keep(); ORD.unshift(o);
        sheet('<div class="msg" style="padding:16px 4px"><b>✓ 주문이 접수되었습니다</b>배송 ' + esc(md(new Date(o.ship + 'T00:00:00Z'))) + ' · ' + o.lines.length + '품목<br>빵을그리다에서 확인하면 「확인 완료」로 바뀝니다.<br><span style="font-size:12px;color:var(--ink3)">주문번호 ' + esc(o.id) + '</span></div><button class="btn pri" id="sDone" style="width:100%;height:50px">확인</button>');
        $('#sDone').onclick = function () { sheet(); render(); window.scrollTo(0, 0); };
      }).catch(function (er) { b.disabled = false; b.textContent = '다시 보내기'; $('#sErr').textContent = er.message + ' (같은 주문이 두 번 들어가지 않으니 다시 눌러도 됩니다)'; }); };
  };
  function fail(m) { $('#who').textContent = '주문서를 열 수 없습니다'; $('#app').innerHTML = '<div class="msg"><b>주문서를 열 수 없습니다</b>' + esc(m) + '<br><br>빵을그리다 ☎ 031-762-1533</div>'; }
  if (!T) { fail('주소가 올바르지 않습니다. 받으신 주문 링크를 다시 눌러 주세요.'); return; }
  load();
  call({ action: 'orderForm', t: T }).then(function (r) { if (!r || !r.ok) return fail((r && r.error) || '잠시 뒤 다시 열어 주세요.'); F = r.form; ORD = r.orders || []; $('#who').textContent = F.name; document.title = F.name + ' · 빵을그리다 주문서';
    Object.keys(st.q).forEach(function (c) { if (!F.items.some(function (it) { return it[0] === c; })) delete st.q[c]; }); render(); })
    .catch(function () { fail('인터넷 연결을 확인하고 다시 열어 주세요.'); });
})();
</script>
</body>
</html>
