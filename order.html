<html lang="ko">

<style>
:root{--bg:#EEF1F3;--paper:#fff;--ink:#16232B;--ink2:#4A5A65;--ink3:#8291A0;--line:#D6DDE3;--line2:#EAEEF1;--brand:#173F4B;--accent:#0E7C6B;--accent-bg:#E3F3EF;--warn:#A86A12;--warn-bg:#FBF1DF;--minus:#B23A3A;--minus-bg:#FBE9E9;
  --font:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,textarea{font:inherit}
.top{background:var(--brand);color:#fff;padding:14px 16px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px;border-radius:11px;background:#FBF6EE;object-fit:contain}.top h1{margin:0;font-size:17px;letter-spacing:-.3px}.top small{display:block;font-size:13px;opacity:.8;margin-top:1px}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}.card h2 span{font-size:12px;color:var(--ink3);font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:96px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;text-align:left;background:#fff}
.day b{display:block;font-size:16px}.day i{font-style:normal;font-size:11.5px;color:var(--ink3)}.day.on{border-color:var(--accent);background:var(--accent-bg)}.day.on b{color:var(--accent)}
.tools{display:flex;gap:8px;margin-bottom:8px}.tools input{flex:1 1 auto;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;white-space:nowrap}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn:disabled{opacity:.45}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line2)}.it:first-child{border-top:0}.it.on .nm b{color:var(--accent)}
.pic{flex:0 0 auto;width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--bg);padding:0}.pic img{width:100%;height:100%;object-fit:cover;display:block}
.nm{flex:1 1 auto;min-width:0}.nm b{display:block;font-size:14.5px;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}.nm span{font-size:12px;color:var(--ink3)}
.st{flex:0 0 auto;display:grid;grid-template-columns:38px 54px 38px;height:40px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.st button{font-size:20px;font-weight:700;color:var(--ink2);background:var(--bg)}.st button:active{background:var(--line)}
.st input{border:0;width:100%;text-align:center;font-size:17px;font-weight:800;color:var(--ink);outline:none}.it.on .st{border-color:var(--accent)}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;background:var(--bg)}
.row2{display:flex;gap:8px;align-items:center;margin-top:8px}.row2 label{font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}.row2 input{flex:1 1 auto;min-width:0;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(16,24,40,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}.bar .sum{flex:1 1 auto;min-width:0;font-size:13px;color:var(--ink2)}.bar .sum b{display:block;font-size:17px;color:var(--ink)}
.bar .btn{height:48px;padding:0 22px;font-size:16px}
.ord{padding:10px 0;border-top:1px solid var(--line2);font-size:13.5px}.ord:first-of-type{border-top:0}.ord .h{display:flex;justify-content:space-between;gap:8px}.ord .l{color:var(--ink2);font-size:12.5px;margin-top:3px}
.rp{margin-top:7px;background:var(--accent-bg);border-radius:10px;padding:9px 11px;font-size:13.5px}.rp p{margin:0 0 5px;white-space:pre-wrap;color:var(--ink)}.rp .dv{font-weight:800;color:var(--accent)}.rp .btn{margin-top:7px}
.stm{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.stm th,.stm td{border:1px solid var(--line);padding:5px 6px}.stm th{background:#f4f1ec;font-weight:800;white-space:nowrap}.stm td.n{text-align:right;white-space:nowrap}.stm tfoot td{font-weight:800}.stm-h{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);flex-wrap:wrap}
.tg{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:1px 7px}.tg.new{background:var(--warn-bg);color:var(--warn)}.tg.ok{background:var(--accent-bg);color:var(--accent)}.tg.bad{background:var(--minus-bg);color:var(--minus)}
.msg{text-align:center;padding:36px 16px;color:var(--ink2);line-height:1.7}.msg b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(16,24,40,.45);display:flex;align-items:flex-end;justify-content:center}.sheet[hidden]{display:none}
.sheet>div{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:17px}.sl{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.sl td{padding:7px 4px;border-bottom:1px solid var(--line2)}.sl td:last-child{text-align:right;font-weight:800;white-space:nowrap}
.cfl{max-height:52vh;overflow:auto;margin:8px 0;border-top:1px solid var(--line2)}.cf{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}.cf .cn{flex:1 1 auto;min-width:0;font-size:14px}.cf .cn b{display:block}.cf .cn span{display:block;font-size:12.5px;color:var(--ink2)}.cf .cn em{font-style:normal;color:var(--ink3)}.cf .st{flex:0 0 auto}.cx{flex:0 0 auto;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px}.ctot{text-align:right;font-size:15px}.ctot b{font-size:18px;color:var(--accent)}#sum .vt{display:inline;font-size:16px;color:var(--accent)}#sum .vs{font-size:11.5px;color:var(--ink3)}.ctot span{display:block;font-size:12px;color:var(--ink3)}
.sheet .btns{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:12px}.sheet .btn{height:50px;font-size:16px}
.note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:10px;padding:8px 10px;margin-bottom:12px;line-height:1.5}
.err{color:var(--minus);font-size:13px;margin-top:6px}
.foot{text-align:center;font-size:12px;color:var(--ink3);margin-top:16px}
.ntc{display:flex;gap:12px;background:#FFF8E6;border:1px solid #F0D9A8;border-radius:14px;padding:12px;margin-bottom:12px}.ntc img{width:84px;height:84px;border-radius:10px;object-fit:cover;flex:0 0 auto;background:#fff}.ntc b{display:block;font-size:15px}.ntc p{margin:4px 0 0;font-size:13.5px;color:var(--ink2);white-space:pre-wrap;line-height:1.5}.ntc .nb{display:flex;gap:6px;margin-top:8px}
.ntc-more{display:block;width:100%;text-align:left;font-size:12.5px;color:var(--ink2);padding:6px 4px;margin:-4px 0 8px}
.btn.sm{height:32px;padding:0 10px;font-size:13px}.btn.smp{background:#FFF1D6;border-color:#E8C98E;color:#8A5A00}
.card h2 .cat-open{margin-left:auto;height:32px;font-size:13px;color:var(--accent);border-color:var(--accent)}
.sub-h{font-size:12px;font-weight:800;color:var(--ink3);margin:10px 0 2px}
.tg.smp{background:#FFF1D6;color:#8A5A00}.tg.cat{background:#E6F0FB;color:#1F5FA8}
.cgrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:6px}.cgrid.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cc{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;display:flex;gap:10px;align-items:center}.cc.on{border-color:var(--accent);background:#F4FBF8}
.cgrid.big .cc{flex-direction:column;align-items:stretch;gap:6px}.cgrid.big .cc .pic{width:100%;height:auto;aspect-ratio:1/1;border-radius:10px}
.pic.none{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink3);background:var(--bg)}.cc.sm .pic{width:56px;height:56px}
.ci{min-width:0;flex:1 1 auto}.ci b{display:block;font-size:14px;line-height:1.3;word-break:keep-all}.ci span{display:block;font-size:12px;color:var(--ink3)}.ci em{display:block;font-style:normal;font-size:12.5px;color:#B23A1E;font-weight:700;margin-top:2px}.ci small{font-size:10.5px;color:var(--ink3)}
.cb{display:flex;gap:6px;flex:0 0 auto}.cgrid.big .cb .btn{flex:1 1 0}.cc.sm .cb{flex-direction:column}
.sheet.wide>div{max-width:900px;max-height:92vh}.cat-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.cat-h h3{margin:0;flex:1 1 auto}.cat-h h3 span{font-size:12px;color:var(--ink3);font-weight:600}
.cat-tabs{display:flex;gap:4px;margin-bottom:8px}.cat-tabs button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-weight:700;font-size:13.5px}.cat-tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.muted-s{font-size:12px;color:var(--ink3);margin-bottom:8px;line-height:1.5}
</style>
</head>
<body>
<header class="top"><img src="brand_logo.png" alt="빵을그리다"><div><h1>빵을그리다 주문서</h1><small id="who">불러오는 중…</small></div></header>
<main id="app"><div class="msg">주문서를 불러오는 중입니다…</div></main>
<div class="bar" id="bar" hidden><div><div class="sum" id="sum"></div><button class="btn pri" id="go" disabled>주문하기</button></div></div>
<div class="sheet" id="sheet" hidden><div id="sheetIn"></div></div>
<script>
/* 빵을그리다 거래처 주문서 — 주소의 #t=토큰 으로 그 거래처의 주문서만 열림. 이 파일에는 거래처·품목 자료가 없음 */
(function () {
  'use strict';
  var RELAY = 'https://script.google.com/macros/s/AKfycbwc4iYf-iUXLIkw_9mENM2nRyX5BNdz4TveLP5cKE-5CXd2hiTQ34kDxSanQFJk9O8S3g/exec';
  var H = new URLSearchParams(location.hash.replace(/^#/, '')), T = (H.get('t') || '').replace(/[^A-Za-z0-9_-]/g, '');
  if (H.get('r')) RELAY = 'https://script.google.com/macros/s/' + H.get('r').replace(/[^A-Za-z0-9_-]/g, '') + '/exec';
  var $ = function (s) { return document.querySelector(s); }, WD = '일월화수목금토';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var IMG = function (id, w) { return /^u:/.test(id) ? id.slice(2) : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 200); };   /* u:주소 = 이 사이트의 단가표 제품 사진(cat/<id>.jpg) */   /* 품목 사진: 구글 드라이브(중계가 보관) */
  var won = function (n) { return Math.round(n || 0).toLocaleString('ko-KR'); };
  var LS = 'bggd_order_' + T.slice(0, 10), F = null, ORD = [], st = { q: {}, ship: '', memo: '', who: '', find: '', seen: [] }, cid = '', CAT = {}, catGrp = '';
  function load() { try { var o = JSON.parse(localStorage.getItem(LS) || 'null'); if (o) { st.q = o.q || {}; st.memo = o.memo || ''; st.who = o.who || ''; st.ship = o.ship || ''; st.seen = o.seen || []; } } catch (e) {} }
  function keep() { try { localStorage.setItem(LS, JSON.stringify({ q: st.q, memo: st.memo, who: st.who, ship: st.ship, seen: st.seen })); } catch (e) {} }
  function call(body) { return fetch(RELAY, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  function ymd(d) { return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
  /* 주문 가능한 배송일: 허용 요일 · (배송일 - lead일) cut시(한국 시각) 전 — 중계와 같은 규칙 */
  function shipDays() { var out = [], now = Date.now(), k = new Date(now + 9 * 3600000), y = k.getUTCFullYear(), m = k.getUTCMonth(), d0 = k.getUTCDate();
    for (var i = 0; i < 28 && out.length < 6; i++) { var d = new Date(Date.UTC(y, m, d0 + i)); if ((F.days || []).indexOf(d.getUTCDay()) < 0) continue;
      var dl = Date.UTC(y, m, d0 + i - (F.lead || 0), F.cut == null ? 15 : F.cut) - 9 * 3600000; if (now < dl) out.push({ v: ymd(d), d: d, dl: new Date(dl + 9 * 3600000) }); }
    return out; }
  function md(d) { return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '(' + WD[d.getUTCDay()] + ')'; }
  var norm = function (x) { return String(x || '').toLowerCase().replace(/[\s()·,./_-]/g, ''); };
  /* 장바구니 한 줄: 거래처 품목 「코드」, 단가표 제품 「cat:id」, 샘플 「cat:id|s」 */
  function ent(k) { if (k.indexOf('cat:') === 0) { var s2 = /\|s$/.test(k), id = k.slice(4).replace(/\|s$/, ''), c = CAT[id]; if (!c) return null; return { k: k, sub: s2 ? 's' : 'c', id: 'cat:' + id, name: c.name + (c.spec ? ' (' + c.spec + ')' : ''), img: c.img, price: s2 ? 0 : null, c: c }; }
    var it = F.items.filter(function (x) { return x[0] === k; })[0]; return it ? { k: k, sub: '', id: k, name: it[1], img: (F.imgs || {})[k], price: it[2], pd: it[4] || '' } : null; }
  function picked() { return Object.keys(st.q).filter(function (k) { return st.q[k] > 0; }).map(ent).filter(Boolean); }
  function tots(p) { var a = 0, v = 0; p.forEach(function (e) { if (e.sub || e.price == null) return; var x = Math.round(e.price * st.q[e.k]); a += x; v += Math.round(x / 10); }); return { a: a, v: v, t: a + v }; }   /* 부가세는 줄마다 공급가의 10% (이카운트와 같게) */
  function sumHtml() { var p = picked(), n = p.reduce(function (t, e) { return t + st.q[e.k]; }, 0), a = F.price ? p.reduce(function (t, e) { return t + (e.sub ? 0 : (e.price || 0) * st.q[e.k]); }, 0) : 0, ns = p.filter(function (e) { return e.sub === 's'; }).length;
    $('#sum').innerHTML = p.length ? '<b>' + p.length + '품목 · ' + n + '개' + (ns ? ' · 샘플 ' + ns : '') + '</b>' + (F.price ? '합계 <b class="vt">' + won(tots(p).t) + '원</b> <span class="vs">(부가세 포함 · 공급가 ' + won(tots(p).a) + ')</span>' : (st.ship ? '배송 ' + esc(md(new Date(st.ship + 'T00:00:00Z'))) : '배송일을 고르세요')) : '<b>품목을 담아 주세요</b>수량을 넣으면 여기에 모입니다';
    $('#go').disabled = !p.length || !st.ship; }
  function row(k, name, sub, img, tag) { var v = st.q[k] || 0;
    return '<div class="it' + (v ? ' on' : '') + '">' + (img ? '<button class="pic" data-pic="' + esc(img) + '" data-nm="' + esc(name) + '" aria-label="' + esc(name) + ' 사진 크게"><img src="' + IMG(img, 160) + '" alt="" loading="lazy"></button>' : '') + '<div class="nm"><b>' + (tag || '') + esc(name) + '</b><span>' + sub + '</span></div><div class="st"><button data-d="-1" data-c="' + esc(k) + '" aria-label="줄이기">−</button><input inputmode="numeric" data-c="' + esc(k) + '" value="' + (v || '') + '" placeholder="0" aria-label="' + esc(name) + ' 수량"><button data-d="1" data-c="' + esc(k) + '" aria-label="늘리기">+</button></div></div>'; }
  function catPrice(c) { return (c.pe != null ? '개당 ' + won(c.pe) + '원' : '') + (c.pb != null ? (c.pe != null ? ' · ' : '') + esc(c.unit || 'Box') + (c.bq ? '(' + c.bq + 'ea)' : '') + ' ' + won(c.pb) + '원' : ''); }
  function catCard(c, small) { var kq = st.q['cat:' + c.id] || 0, ks = st.q['cat:' + c.id + '|s'] || 0;
    return '<div class="cc' + (small ? ' sm' : '') + (kq || ks ? ' on' : '') + '" id="cc_' + esc(c.id) + '">' + (c.img ? '<button class="pic" data-pic="' + esc(c.img) + '" data-nm="' + esc(c.name) + '"><img src="' + IMG(c.img, small ? 160 : 400) + '" alt="" loading="lazy" onerror="var p=this.parentNode;p.className=\'pic none\';p.textContent=\'사진 준비 중\'"></button>' : '<div class="pic none">사진 준비 중</div>') +
      '<div class="ci"><b>' + esc(c.name) + '</b><span>' + esc(c.spec || '') + '</span><em>' + catPrice(c) + '</em>' + (c.pe != null || c.pb != null ? '<small>VAT 별도 · 단가표 기준</small>' : '') + '</div>' +
      '<div class="cb"><button class="btn sm' + (kq ? ' pri' : '') + '" data-cadd="' + esc(c.id) + '">' + (kq ? '담음 ' + kq : '담기') + '</button><button class="btn sm' + (ks ? ' smp' : '') + '" data-csmp="' + esc(c.id) + '">' + (ks ? '✓ 샘플' : '샘플 신청') + '</button></div></div>'; }
  function noticesHtml() { var N = (F.notices || []).filter(function (n) { return st.seen.indexOf(n.id) < 0 || n.pin; }), hid = (F.notices || []).length - N.length;
    return (N.length ? N.map(function (n) { var c = n.cat && CAT[n.cat]; return '<section class="ntc">' + (c && c.img ? '<img src="' + IMG(c.img, 300) + '" alt="" onerror="this.remove()">' : '') + '<div><b>📢 ' + esc(n.title) + '</b>' + (n.body ? '<p>' + esc(n.body) + '</p>' : '') + '<div class="nb">' + (c ? '<button class="btn sm pri" data-ncat="' + esc(n.cat) + '">제품 보기</button>' : '') + (n.pin ? '' : '<button class="btn sm" data-nx="' + esc(n.id) + '">닫기</button>') + '</div></div></section>'; }).join('') : '') +
      (hid > 0 ? '<button class="ntc-more" id="ntcAll">📢 지난 안내 ' + hid + '개 다시 보기</button>' : ''); }
  function render() {
    var days = shipDays(); if (!days.some(function (x) { return x.v === st.ship; })) st.ship = days[0] ? days[0].v : '';
    var q = norm(st.find), list = F.items.filter(function (it) { return !q || norm(it[1]).indexOf(q) >= 0 || norm(it[0]).indexOf(q) >= 0; });
    var catAll = Object.keys(CAT).map(function (id) { return CAT[id]; }), catHit = q ? catAll.filter(function (c) { return norm(c.name + c.spec).indexOf(q) >= 0; }) : [];
