<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A4A23">
<title>빵을그리다 생산실</title>
<link rel="manifest" href="field.webmanifest">
<link rel="apple-touch-icon" href="field_apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생산실">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F1EA;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#3d342a}
.ld{text-align:center;padding:24px;font-size:19px;line-height:1.7;word-break:keep-all}
.ld b{display:block;font-size:26px;margin-bottom:6px}
.ld button{margin-top:16px;min-height:54px;padding:8px 24px;font-size:18px;font-weight:700;border-radius:14px;border:0;background:#7A4A23;color:#fff}
</style>
</head>
<body>
<div class="ld" id="ld"><b>🍞 생산실</b>불러오는 중입니다…</div>
<script>
/* 빵을그리다 생산실 앱 (2026-10-22)
   - 통합 재고관리(index.html)를 그대로 불러와 「생산일지·CCP 현장 입력」 화면만 보이게 한다.
   - 그래서 자료·로그인·동기화는 통합 재고관리와 같고, PC에서 바로 보고 고치고 승인할 수 있다.
   - index.html이 바뀌면 이 앱도 자동으로 최신이 된다(따로 고칠 필요 없음). */
window.FIELD_APP = true;
(function () {
  function fail() {
    document.getElementById('ld').innerHTML = '<b>🍞 생산실</b>인터넷 연결을 확인한 뒤 다시 열어 주세요.<br><button onclick="location.reload()">다시 열기</button>';
  }
  function get() {
    return fetch('index.html', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .catch(function () { return caches.match('./index.html').then(function (r) { if (!r) throw 0; return r.text(); }); });
  }
  Promise.all([get(), fetch('field_patch.js', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .catch(function () { return caches.match('./field_patch.js').then(function (r) { if (!r) throw 0; return r.text(); }); })])
    .then(function (a) {
      var t = a[0], patch = a[1];
      var s = t.indexOf('<script type="text/plain" id="app-code">'); var e = s < 0 ? -1 : t.indexOf('</' + 'script>', s);
      if (s < 0 || e < 0) throw 0;
      t = t.slice(0, e) + '\n' + patch + '\n' + t.slice(e);
      t = t.replace('href="manifest.webmanifest"', 'href="field.webmanifest"')
           .replace(/<title>[^<]*<\/title>/, '<title>빵을그리다 생산실</title>')
           .replace(/(apple-mobile-web-app-title" content=")[^"]*/, '$1생산실')
           .replace(/<head>/i, '<head><script>window.FIELD_APP=true<\/script><link rel="apple-touch-icon" href="field_apple.png">');
      document.open(); document.write(t); document.close();
    }).catch(fail);
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
